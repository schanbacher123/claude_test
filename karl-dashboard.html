// ── Reducer ───────────────────────────────────────────────────────────────
function reducer(st,a){
  if(a.type==='SET')    return Object.assign({},st,{readings:a.p});
  if(a.type==='ADD')    return Object.assign({},st,{readings:st.readings.concat([a.p])});
  if(a.type==='TAB')    return Object.assign({},st,{activeTab:a.p});
  if(a.type==='SET_CFG')return Object.assign({},st,{settings:Object.assign({},st.settings,a.p)});
  if(a.type==='CLEAR')  return Object.assign({},st,{readings:[]});
  return st;
}

// ── Calculations ──────────────────────────────────────────────────────────
function calcEm(r,s){
  var n2o=(r.inflowTN/1000)*r.inflowVolume*0.016*(44/28)*s.gwp_n2o/1000;
  var ch4=r.biogas*(r.biogasMethane/100)*0.02*0.717*s.gwp_ch4/1000;
  var oil=(r.heatOil||0)*2.65/1000;
  var s1=n2o+ch4+oil;
  var s2=Math.max(0,(r.powerConsumption-r.powerGeneration)*r.gridEmissionFactor/1e6);
  var sl=(r.sludgeDisposal*r.sludgeTransport*s.ef_transport)/1000;
  var ch=r.ironSulfate*s.ef_iron+r.polyelectrolyte*s.ef_poly;
  var s3=sl+ch;
  var tot=s1+s2+s3;
  return{s1:s1,s2:s2,s3:s3,tot:tot,n2o:n2o,ch4:ch4,oil:oil,pwr:s2,sl:sl,ch:ch,
         sp:r.connectedEW>0?tot/(r.connectedEW/1000):0};
}
function calcComp(r,sc){
  var chk=[
    {p:'CSB',v:r.effluentCSB,lim:KL.CSB[sc]},{p:'BSB5',v:r.effluentBSB5,lim:KL.BSB5[sc]},
    {p:'SS',v:r.effluentSS,lim:KL.SS[sc]},{p:'TN',v:r.effluentTN,lim:KL.TN[sc]},
    {p:'TP',v:r.effluentTP,lim:KL.TP[sc]},{p:'NH4',v:r.effluentNH4,lim:KL.NH4[sc]},
  ].filter(function(c){return c.lim!=null;});
  var viol=chk.filter(function(c){return c.v>c.lim;});
  var score=chk.length?Math.round(((chk.length-viol.length)/chk.length)*100):100;
  return{score:score,viol:viol,status:score>=95?'g':score>=80?'y':'r'};
}

// ── Benchmark helpers ─────────────────────────────────────────────────────
function avgField(readings,k){
  if(!readings.length)return 0;
  return readings.reduce(function(a,r){return a+(r[k]||0);},0)/readings.length;
}
function calculateAnnualKPIs(readings,settings){
  if(!readings.length)return null;
  var r=readings.slice(-12);
  var sumF=function(k){return r.reduce(function(a,x){return a+(x[k]||0);},0);};
  var avgF=function(k){return r.reduce(function(a,x){return a+(x[k]||0);},0)/r.length;};
  var totPwr=sumF('powerConsumption');
  var totGen=sumF('powerGeneration');
  var avgEW=avgF('connectedEW');
  var totEm=r.reduce(function(a,x){return a+calcEm(x,settings).tot;},0);
  var avgCSBin=avgF('inflowCSB');var avgCSBout=avgF('effluentCSB');
  var avgTNin=avgF('inflowTN');var avgTNout=avgF('effluentTN');
  var avgTPout=avgF('effluentTP');
  var typTPinlet=8;
  return{
    energyPerEW:avgEW>0?totPwr/avgEW:0,
    selfSupply:totPwr>0?(totGen/totPwr*100):0,
    csbElimination:avgCSBin>0?(avgCSBin-avgCSBout)/avgCSBin*100:0,
    pElimination:Math.max(0,(typTPinlet-avgTPout)/typTPinlet*100),
    nElimination:avgTNin>0?(avgTNin-avgTNout)/avgTNin*100:0,
    co2ePerEW:avgEW>0?(totEm*1000/avgEW):0,
    connectedEW:avgEW,
    selfSupplyRaw:totPwr>0?(totGen/totPwr*100):0,
    avgTPout:avgTPout,
    avgTNout:avgTNout,
    bmEnergyMedian:(DWA_BM.energyPerEW['GK4']||{median:32}).median,
  };
}
function getRating(value,bm,hib){
  if(hib===false){
    if(value<=bm.p25)return{label:'🏆 Vorbildlich',cls:'text-green-400',txt:'Besser als 75% der Anlagen'};
    if(value<=bm.median)return{label:'✅ Gut',cls:'text-green-300',txt:'Besser als 50% der Anlagen'};
    if(value<=bm.p75)return{label:'⚠️ Durchschnitt',cls:'text-yellow-400',txt:'Schlechter als 50% der Anlagen'};
    return{label:'🔴 Handlungsbedarf',cls:'text-red-400',txt:'Im untersten Quartil'};
  }else{
    if(value>=bm.p75)return{label:'🏆 Vorbildlich',cls:'text-green-400',txt:'Besser als 75% der Anlagen'};
    if(value>=bm.median)return{label:'✅ Gut',cls:'text-green-300',txt:'Besser als 50% der Anlagen'};
    if(value>=bm.p25)return{label:'⚠️ Durchschnitt',cls:'text-yellow-400',txt:'Schlechter als 50% der Anlagen'};
    return{label:'🔴 Handlungsbedarf',cls:'text-red-400',txt:'Im untersten Quartil'};
  }
}

function getUrgencyScore(m){
  var yr=new Date().getFullYear();
  var yrs=m.deadline-yr;
  var ds=yrs<3?40:yrs<6?25:10;
  var ps={critical:40,high:25,medium:10}[m.prio]||0;
  var ep={low:0,medium:5,high:10}[m.effort]||0;
  return ds+ps-ep;
}
function getRecommendedMeasures(kpis){
  return MEASURES
    .filter(function(m){return m.trigger(kpis);})
    .map(function(m){return Object.assign({},m,{urgency:getUrgencyScore(m)});})
    .sort(function(a,b){return b.urgency-a.urgency;});
}

function CChart(p){
  var ref=useRef(null);var inst=useRef(null);
  var key=JSON.stringify(p.cfg);
  useEffect(function(){
    if(!ref.current)return;
    if(inst.current){try{inst.current.destroy();}catch(e){} inst.current=null;}
    try{inst.current=new Chart(ref.current,p.cfg);}catch(e){console.error('Chart error:',e);}
    return function(){if(inst.current){try{inst.current.destroy();}catch(e){} inst.current=null;}};
  },[key]);
  return h('div',{style:{position:'relative',height:(p.h||220)+'px'}},h('canvas',{ref:ref}));
}

// ── Grenzwerte ────────────────────────────────────────────────────────────
function Grenzwerte(p){
  var data=useMemo(function(){
    return p.readings.map(function(r){return Object.assign({},r,{co:calcComp(r,p.settings.sizeClass)});});
  },[p.readings,p.settings]);
  if(!data.length)return h('div',{className:'text-center text-gray-500 py-20'},'Keine Daten vorhanden.');
  var params=['CSB','BSB5','SS','TN','TP','NH4'];
  var ek={CSB:'effluentCSB',BSB5:'effluentBSB5',SS:'effluentSS',TN:'effluentTN',TP:'effluentTP',NH4:'effluentNH4'};
  var sc=p.settings.sizeClass,lim=KL.CSB[sc];
  var sl=data.slice(-12),lb=sl.map(fd);
  var cCfg={type:'bar',data:{labels:lb,datasets:[
    {label:'CSB Ablauf',data:sl.map(function(d){return+d.effluentCSB.toFixed(1);}),backgroundColor:'#0ea5e9',order:2},
    {type:'line',label:'Grenzwert',data:sl.map(function(){return lim;}),borderColor:'#ef4444',borderDash:[5,3],pointRadius:0,borderWidth:2,order:1},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:LS},scales:SO}};
  return h('div',{className:'space-y-6'},
    h('h2',{className:'text-lg font-semibold text-sky-300'},'EU-KARL Grenzwert-Tracking ('+sc+')'),
    h('div',{className:'grid gap-4',style:{gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}},
      params.filter(function(pm){return KL[pm][sc]!=null;}).map(function(pm){
        var lm=KL[pm][sc];
        var vals=data.map(function(d){return d[ek[pm]];});
        var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length;
        var vc=vals.filter(function(v){return v>lm;}).length;
        var pct=Math.min(100,(avg/lm)*100);
        return h('div',{className:'card card-info',key:pm,onClick:function(){p.onInfo(pm);}},
          h('span',{className:'info-icon'},'ⓘ'),
          h('div',{className:'flex justify-between items-center mb-2'},
            h('span',{className:'font-semibold text-gray-200'},pm),
            h('span',{className:'text-xs text-gray-500'},'Limit: '+lm+' mg/L')),
          h('div',{className:'text-xl font-bold '+(avg>lm?'text-red-400':'text-green-400')},f(avg,1)+' mg/L'),
          h('div',{className:'mt-2 h-2 bg-gray-700 rounded-full overflow-hidden'},
            h('div',{className:'h-2 rounded-full '+(pct>100?'bg-red-500':pct>85?'bg-yellow-500':'bg-green-500'),style:{width:Math.min(pct,100)+'%'}})),
          h('div',{className:'text-xs text-gray-500 mt-1'},vc+' Verstöße / '+vals.length+' Messungen'));
      })),
    h('div',{className:'card'},
      h('div',{className:'text-sm font-semibold text-gray-300 mb-3'},'CSB-Verlauf vs. Grenzwert'),
      h(CChart,{cfg:cCfg,h:220})),
    h('div',{className:'card overflow-x-auto'},
      h('div',{className:'text-sm font-semibold text-gray-300 mb-3'},'Compliance-Details'),
      h('table',null,
        h('thead',null,h('tr',null,
          h('th',null,'Monat'),
          params.filter(function(pm){return KL[pm][sc]!=null;}).map(function(pm){return h('th',{key:pm},pm);}),
          h('th',null,'Score'))),
        h('tbody',null,data.slice(-8).reverse().map(function(d){
          return h('tr',{key:d.id},
            h('td',null,fd(d)),
            params.filter(function(pm){return KL[pm][sc]!=null;}).map(function(pm){
              var v=d[ek[pm]],lm=KL[pm][sc];
              return h('td',{key:pm,className:v>lm?'text-red-400 font-semibold':'text-green-400'},f(v,1));
            }),
            h('td',null,h(Bdg,{st:d.co.status,label:d.co.score+'%'})));
        })))));
}

// ── Energie ───────────────────────────────────────────────────────────────
function Energie(p){
  if(!p.readings.length)return h('div',{className:'text-center text-gray-500 py-20'},'Keine Daten vorhanden.');
  var last=p.readings[p.readings.length-1];
  var net=last.powerConsumption-last.powerGeneration;
  var cov=last.powerConsumption>0?Math.round((last.powerGeneration/last.powerConsumption)*100):0;
  var sl=p.readings.slice(-12),lb=sl.map(fd);
  var pCfg={type:'bar',data:{labels:lb,datasets:[
    {label:'Strombezug',data:sl.map(function(d){return+d.powerConsumption.toFixed(0);}),backgroundColor:'#f59e0b',order:2},
    {label:'Eigenproduktion',data:sl.map(function(d){return+d.powerGeneration.toFixed(0);}),backgroundColor:'#10b981',order:2},
    {type:'line',label:'Nettobezug',data:sl.map(function(d){return+(d.powerConsumption-d.powerGeneration).toFixed(0);}),
     borderColor:'#ef4444',backgroundColor:'transparent',tension:.3,pointRadius:3,order:1},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:LS},scales:SO}};
  var bCfg={type:'bar',data:{labels:lb,datasets:[
    {label:'Biogas (m³)',data:sl.map(function(d){return+d.biogas.toFixed(0);}),backgroundColor:'#10b981'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:LS},scales:SO}};
  return h('div',{className:'space-y-6'},
    h('h2',{className:'text-lg font-semibold text-sky-300'},'Energie-Monitoring'),
    h('div',{className:'grid gap-4',style:{gridTemplateColumns:'repeat(auto-fit,minmax(175px,1fr))'}},
      h(KPI,{title:'Strombezug (netto)',value:f(net,0),unit:'kWh',color:'text-yellow-400',ik:'net_power',onInfo:p.onInfo}),
      h(KPI,{title:'Eigendeckungsgrad',value:cov,unit:'%',color:cov>60?'text-green-400':cov>40?'text-yellow-400':'text-red-400',ik:'coverage',onInfo:p.onInfo}),
      h(KPI,{title:'Biogasproduktion',value:f(last.biogas,0),unit:'m³',color:'text-emerald-400',ik:'biogas',onInfo:p.onInfo}),
      h(KPI,{title:'Methangehalt',value:f(last.biogasMethane,1),unit:'%',color:'text-sky-400',ik:'methane',onInfo:p.onInfo}),
      h(KPI,{title:'Emissionsfaktor',value:f(last.gridEmissionFactor,0),unit:'g/kWh',color:'text-gray-400',ik:'ef',onInfo:p.onInfo})),
    h('div',{className:'card'},h('div',{className:'text-sm font-semibold text-gray-300 mb-3'},'Strombezug vs. Eigenproduktion (kWh)'),h(CChart,{cfg:pCfg,h:240})),
    h('div',{className:'card'},h('div',{className:'text-sm font-semibold text-gray-300 mb-3'},'Biogasproduktion (m³)'),h(CChart,{cfg:bCfg,h:180})));
}

function Datenimport(p){
  var fr=useRef(null);
  var ms=useState('');var msg=ms[0],setMsg=ms[1];
  var fs=useState(Object.assign({},EF2));var form=fs[0],setForm=fs[1];
  function setF(k,v){setForm(function(prev){var n=Object.assign({},prev);n[k]=v;return n;});}
  function csv(e){
    var fl=e.target.files[0];if(!fl)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      try{
        var lines=ev.target.result.split('\n').filter(Boolean);
        var hd=lines[0].split(';').map(function(x){return x.trim();});
        var rows=lines.slice(1).map(function(l,id){
          var vs=l.split(';'),o={id:id};
          hd.forEach(function(hh,i){o[hh]=isNaN(vs[i])?vs[i]:Number(vs[i]);});
          return o;
        }).filter(function(r){return r.year&&r.month!=null;});
        p.dispatch({type:'SET',p:rows});setMsg(rows.length+' Einträge importiert.');
      }catch(err){setMsg('Fehler: '+err.message);}
    };
    rd.readAsText(fl);
  }
  var SF=[['plantName','Anlagenname','text'],['gwp_n2o','GWP N₂O','number'],
    ['gwp_ch4','GWP CH₄','number'],['ef_transport','EF Transport','number'],
    ['ef_iron','EF Eisensulfat','number'],['ef_poly','EF Polyelektrolyt','number']];

      h('div',{className:'card'},
        h('div',{className:'font-semibold text-gray-300 mb-2'},'📂 CSV importieren'),
        h('div',{className:'text-xs text-gray-500 mb-3'},'Semikolon als Trennzeichen.'),
        h('input',{type:'file',accept:'.csv',ref:fr,onChange:csv,style:{display:'none'}}),
        h('button',{className:'nav-btn nav-inactive',style:{width:'100%'},onClick:function(){fr.current.click();}},'Datei wählen…')),
      h('button',{className:'card text-center',style:{cursor:'pointer'},
        onClick:function(){p.dispatch({type:'CLEAR'});setMsg('Daten gelöscht.');}},
        h('div',{style:{fontSize:'2rem',marginBottom:'.5rem'}},'🗑️'),
        h('div',{className:'font-semibold text-red-400'},'Daten löschen'),
        h('div',{className:'text-xs text-gray-500 mt-1'},'Alle Einträge entfernen'))),
    g(msg,h('div',{className:'card text-sm text-green-400'},msg)),
    h('div',{className:'card'},
      h('div',{className:'font-semibold text-gray-300 mb-4'},'Manuelle Dateneingabe'),
      h('div',{className:'grid gap-3',style:{gridTemplateColumns:'repeat(auto-fit,minmax(155px,1fr))'}},
        MF.map(function(fl){
          return h('div',{key:fl[0]},
            h('label',{className:'text-xs text-gray-500 block mb-1'},fl[1]),
            h('input',{type:'number',className:'w-full',value:form[fl[0]],
              onChange:function(e){var v=e.target.value;setF(fl[0],v===''?v:isNaN(v)?v:Number(v));}}));
        })),
      h('button',{className:'nav-btn nav-active',style:{marginTop:'1rem'},
        onClick:function(){p.dispatch({type:'ADD',p:Object.assign({},form,{id:Date.now()})});setMsg('Eintrag hinzugefügt.');}},
        'Eintrag speichern')),
    h('div',{className:'card'},
      h('div',{className:'font-semibold text-gray-300 mb-3'},'Anlageneinstellungen'),
      h('div',{className:'grid gap-3',style:{gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}},
        SF.map(function(fl){
          return h('div',{key:fl[0]},
            h('label',{className:'text-xs text-gray-500 block mb-1'},fl[1]),
            h('input',{type:fl[2],className:'w-full',value:p.settings[fl[0]],

        }),
        h('div',null,
          h('label',{className:'text-xs text-gray-500 block mb-1'},'Größenklasse'),
          h('select',{className:'w-full',value:p.settings.sizeClass,
            onChange:function(e){p.dispatch({type:'SET_CFG',p:{sizeClass:e.target.value}});}},
            SC.map(function(s){return h('option',{key:s,value:s},s);}))))));
}

  if(!kpis)return null;

  var bms=DWA_BM;
  var bmSC=sc;
  var rows=[
    {key:'energyPerEW',val:kpis.energyPerEW,bm:bms.energyPerEW[bmSC]},
    {key:'selfSupply',val:kpis.selfSupply,bm:bms.selfSupply[bmSC]},
    {key:'csbElimination',val:kpis.csbElimination,bm:bms.csbElimination[bmSC]},

  // Time series chart for selected param
  var sl=p.readings.slice(-12),lb=sl.map(fd);

  var selVals=sl.map(function(r){

    if(selParam==='selfSupply')return r.powerConsumption>0?(r.powerGeneration/r.powerConsumption*100):0;
    if(selParam==='csbElimination')return r.inflowCSB>0?(r.inflowCSB-r.effluentCSB)/r.inflowCSB*100:0;
    if(selParam==='pElimination'){var ti=8;return Math.max(0,(ti-r.effluentTP)/ti*100);}
    if(selParam==='nElimination')return r.inflowTN>0?(r.inflowTN-r.effluentTN)/r.inflowTN*100:0;
    if(selParam==='co2ePerEW')return r.connectedEW>0?calcEm(r,p.settings).tot*1000/r.connectedEW:0;
    return 0;

  var tsCfg=selBm?{type:'line',data:{labels:lb,datasets:[
    {label:'p25',data:lb.map(function(){return selBm.p25;}),fill:false,borderColor:'transparent',backgroundColor:'transparent',pointRadius:0},
    {label:'Bandbreite p25–p75',data:lb.map(function(){return selBm.p75;}),fill:'-1',backgroundColor:'rgba(100,116,139,.18)',borderColor:'transparent',pointRadius:0},
    {label:'Median (DWA)',data:lb.map(function(){return selBm.median;}),borderColor:'#475569',borderDash:[4,4],borderWidth:2,pointRadius:0,fill:false},

    h('div',{className:'card',style:{background:'#1e3a4a',borderColor:'#0ea5e9'}},

    h('div',{className:'grid gap-4',style:{gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))'}},
      rows.map(function(row){
        var bm=row.bm;

          h('div',{className:'flex justify-between items-start mb-1'},

        h('select',{value:selParam,onChange:function(e){setSelParam(e.target.value);},style:{fontSize:'.8rem'}},
          BM_KEYS.map(function(k){var b=bms[k]&&bms[k][bmSC];return b?h('option',{key:k,value:k},b.label):null;}))),

        })))));

// ── Simulator ─────────────────────────────────────────────────────────────
function Simulator(p){
  var simMeasures=MEASURES.filter(function(m){return m.sim;});
  var selState=useState(simMeasures[0]?simMeasures[0].id:'');
  var selId=p.activeMeasureId||selState[0];
  var setSelId=selState[1];
  var activeId=selId;
  var sliderState=useState({});var sliderVals=sliderState[0],setSliderVals=sliderState[1];
  var comboState=useState([]);var combo=comboState[0],setCombo=comboState[1];

  var activeMeasure=simMeasures.find(function(m){return m.id===activeId;});
  var sliderVal=sliderVals[activeId]||0;

  var simReadings=useMemo(function(){
    var active=combo.length?combo:[activeId].filter(Boolean);
    return active.reduce(function(data,mid){
      var m=MEASURES.find(function(x){return x.id===mid;});
      if(!m||!m.sim)return data;
      var val=sliderVals[mid]||0;
      return m.sim.effect(data,val);
    },p.readings);
  },[p.readings,activeId,combo,sliderVals]);

  var origEm=useMemo(function(){
    return p.readings.reduce(function(a,r){return a+calcEm(r,p.settings).tot;},0);
  },[p.readings,p.settings]);
  var simEm=useMemo(function(){
    return simReadings.reduce(function(a,r){return a+calcEm(r,p.settings).tot;},0);
  },[simReadings,p.settings]);
  var origGen=useMemo(function(){
    return p.readings.reduce(function(a,r){return a+r.powerGeneration;},0);
  },[p.readings]);
  var origPwr=useMemo(function(){
    return p.readings.reduce(function(a,r){return a+r.powerConsumption;},0);
  },[p.readings]);
  var simGen=useMemo(function(){
    return simReadings.reduce(function(a,r){return a+r.powerGeneration;},0);
  },[simReadings]);
  var simPwr=useMemo(function(){
    return simReadings.reduce(function(a,r){return a+r.powerConsumption;},0);
  },[simReadings]);
  var origSelf=origPwr>0?(origGen/origPwr*100):0;
  var simSelf=simPwr>0?(simGen/simPwr*100):0;

  var sl=p.readings.slice(-12);
  var simSl=simReadings.slice(-12);
  var lb=sl.map(fd);
  var chartCfg={type:'line',data:{labels:lb,datasets:[
    {label:'Original THG',data:sl.map(function(r){return+calcEm(r,p.settings).tot.toFixed(2);}),
     borderColor:'#475569',borderDash:[5,3],backgroundColor:'transparent',tension:.3,pointRadius:2},
    {label:'Simuliert THG',data:simSl.map(function(r){return+calcEm(r,p.settings).tot.toFixed(2);}),
     borderColor:'#38bdf8',backgroundColor:'rgba(56,189,248,.1)',tension:.3,pointRadius:3,fill:true},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:LS},scales:SO}};

  function setSlider(mid,val){setSliderVals(function(prev){var n=Object.assign({},prev);n[mid]=val;return n;});}
  function toggleCombo(mid){
    setCombo(function(prev){
      return prev.indexOf(mid)>=0?prev.filter(function(x){return x!==mid;}):prev.concat([mid]);
    });
  }

  if(!p.readings.length)return null;
  return h('div',{className:'card space-y-4'},
    h('div',{className:'text-base font-semibold text-sky-300'},'📊 Maßnahmen-Simulator'),
    h('div',{className:'grid gap-4',style:{gridTemplateColumns:'1fr 1fr'}},
      h('div',null,
        h('label',{className:'text-xs text-gray-500 block mb-1'},'Maßnahme wählen'),
        h('select',{value:activeId,onChange:function(e){setSelId(e.target.value);},className:'w-full'},
          simMeasures.map(function(m){return h('option',{key:m.id,value:m.id},m.title);}))),
      h('div',null,
        h('div',{className:'text-xs text-gray-500 mb-1'},'Kombination (mehrere gleichzeitig)'),
        h('div',{style:{display:'flex',flexWrap:'wrap',gap:'.25rem'}},
          simMeasures.map(function(m){
            var on=combo.indexOf(m.id)>=0;
            return h('button',{key:m.id,className:'nav-btn '+(on?'nav-active':'nav-inactive'),
              style:{fontSize:'.7rem',padding:'.2rem .5rem'},onClick:function(){toggleCombo(m.id);}},
              m.title.split(' ')[0]);
          })))),
    activeMeasure&&activeMeasure.sim&&h('div',null,
      h('label',{className:'text-xs text-gray-500 block mb-2'},
        activeMeasure.sim.label+': ',
        h('span',{className:'text-sky-400 font-bold'},sliderVal+' '+activeMeasure.sim.unit)),
      h('input',{type:'range',className:'w-full',
        min:activeMeasure.sim.min,max:activeMeasure.sim.max,step:activeMeasure.sim.step,
        value:sliderVal,onChange:function(e){setSlider(activeId,Number(e.target.value));}}),
      h('div',{className:'flex justify-between text-xs text-gray-600'},
        h('span',null,activeMeasure.sim.min+' '+activeMeasure.sim.unit),
        h('span',null,activeMeasure.sim.max+' '+activeMeasure.sim.unit))),
    h('div',{className:'grid gap-3',style:{gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))'}},
      [
        {label:'Gesamt-THG/Jahr',orig:f(origEm,1)+' t CO₂e',sim:f(simEm,1)+' t CO₂e',better:simEm<origEm,delta:f(simEm-origEm,1)+' t'},
        {label:'Eigenversorgung',orig:f(origSelf,1)+'%',sim:f(simSelf,1)+'%',better:simSelf>origSelf,delta:f(simSelf-origSelf,1)+' PP'},
      ].map(function(kv,i){
        return h('div',{key:i,className:'card',style:{padding:'.75rem'}},
          h('div',{className:'text-xs text-gray-500 mb-1'},kv.label),
          h('div',{className:'text-xs text-gray-400'},'Ist: ',h('span',{className:'text-gray-200'},kv.orig)),
          h('div',{className:'text-xs text-gray-400'},'Sim: ',h('span',{className:kv.better?'text-green-400':'text-red-400'},kv.sim)),
          h('div',{className:'text-xs font-semibold '+(kv.better?'text-green-400':'text-red-400')},
            kv.better?'▼ ':'▲ ',kv.delta.replace('-','').replace('+','')));
      })),
    h('div',null,
      h('div',{className:'text-sm font-semibold text-gray-300 mb-2'},'THG-Verlauf: Original vs. Simuliert'),
      h(CChart,{cfg:chartCfg,h:180})));
}

// ── KARL Roadmap ──────────────────────────────────────────────────────────
function KarlRoadmap(){
  var W=880,H=160,PAD=20;
  var yr2x=function(y){return PAD+(y-2025)/(2045-2025)*(W-2*PAD);};
  var now=new Date().getFullYear();
  return h('div',{className:'card roadmap-wrap'},
    h('div',{className:'text-sm font-semibold text-gray-300 mb-3'},'KARL-Fristenplan 2025–2045'),
    h('svg',{viewBox:'0 0 '+W+' '+H,style:{width:'100%',minWidth:'600px'}},
      // Axis line
      h('line',{x1:PAD,y1:H/2,x2:W-PAD,y2:H/2,stroke:'#334155',strokeWidth:2}),
      // Today marker
      h('line',{x1:yr2x(now),y1:H/2-20,x2:yr2x(now),y2:H/2+20,stroke:'#0ea5e9',strokeWidth:2,strokeDasharray:'4,3'}),
      h('text',{x:yr2x(now),y:H/2+32,textAnchor:'middle',fill:'#0ea5e9',fontSize:10},'Heute'),
      // Year ticks
      [2025,2030,2035,2040,2045].map(function(y){
        return h('g',{key:y},
          h('line',{x1:yr2x(y),y1:H/2-4,x2:yr2x(y),y2:H/2+4,stroke:'#475569',strokeWidth:1}),
          h('text',{x:yr2x(y),y:H/2+16,textAnchor:'middle',fill:'#64748b',fontSize:9},y));
      }),
      // Events
      ROADMAP.map(function(ev,i){
        var x=yr2x(ev.year);
        var above=ev.above;
        var cy=above?H/2-28:H/2+28;
        var ly=above?H/2-40:H/2+40;
        var past=ev.year<=now;
        var col=past?'#475569':ev.color;

// ── Handlungsplan ─────────────────────────────────────────────────────────
function Handlungsplan(p){
  var kpis=useMemo(function(){return calculateAnnualKPIs(p.readings,p.settings)||{selfSupply:0,energyPerEW:999,connectedEW:0,avgTPout:1,avgTNout:15};},
    [p.readings,p.settings]);

  var measures=useMemo(function(){return getRecommendedMeasures(kpis);},[kpis]);

  var filterState=useState({cat:'Alle',prio:'Alle'});var filt=filterState[0],setFilt=filterState[1];
  var simState=useState(null);var simId=simState[0],setSimId=simState[1];

  var cats=['Alle','Energie','Grenzwerte','KARL-Pflicht','Ressourcen','Compliance'];
  var prios=['Alle','critical','high','medium'];
  var prioLabel={critical:'Kritisch',high:'Hoch',medium:'Mittel'};

  var filtered=measures.filter(function(m){
    return(filt.cat==='Alle'||m.cat===filt.cat)&&(filt.prio==='Alle'||m.prio===filt.prio);
  });

  var critCount=measures.filter(function(m){return m.prio==='critical';}).length;

  // KARL readiness
  var sc=p.settings.sizeClass;
  var tnLim=KL.TN[sc]||13;var tpLim=KL.TP[sc]||1;
  var readiness={
    energyAudit:false,
    virusMonitoring:false,
    rainwaterPlan:false,
    tnCompliant:kpis.avgTNout!=null&&kpis.avgTNout<tnLim*0.9,
    tpCompliant:kpis.avgTPout!=null&&kpis.avgTPout<tpLim*0.9,
    stage4Planned:kpis.connectedEW<10000,
  };
  var readScore=KARL_REQ.reduce(function(a,r){return a+(readiness[r.id]?r.weight:0);},0);

  if(!p.readings.length)return h('div',{className:'text-center text-gray-500 py-20'},'Keine Daten vorhanden – bitte Demodaten laden.');

  return h('div',{className:'space-y-6'},
    h('h2',{className:'text-lg font-semibold text-sky-300'},'Handlungsplan – KARL-Compliance & Maßnahmen'),

    // Summary KPIs
    h('div',{className:'grid gap-4',style:{gridTemplateColumns:'repeat(auto-fit,minmax(175px,1fr))'}},
      h('div',{className:'card'},
        h('div',{className:'text-xs text-gray-500 uppercase mb-1'},'Identifizierte Maßnahmen'),
        h('div',{className:'kv text-sky-400'},measures.length)),
      h('div',{className:'card'},
        h('div',{className:'text-xs text-gray-500 uppercase mb-1'},'Davon kritisch / KARL-Pflicht'),
        h('div',{className:'kv text-red-400'},critCount)),
      h('div',{className:'card'},
        h('div',{className:'text-xs text-gray-500 uppercase mb-1'},'KARL-Readiness-Score'),
        h('div',{className:'kv '+(readScore>=70?'text-green-400':readScore>=40?'text-yellow-400':'text-red-400')},readScore+'%'),
        h('div',{className:'mt-2 h-2 bg-gray-700 rounded-full overflow-hidden'},
          h('div',{className:'h-2 rounded-full '+(readScore>=70?'bg-green-500':readScore>=40?'bg-yellow-500':'bg-red-500'),style:{width:readScore+'%'}})))),

    // KARL Readiness detail
    h('div',{className:'card'},
      h('div',{className:'text-sm font-semibold text-gray-300 mb-3'},'KARL-Readiness-Anforderungen'),
      h('div',{className:'grid gap-2',style:{gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}},
        KARL_REQ.map(function(r){
          var ok=readiness[r.id];
          return h('div',{key:r.id,className:'flex items-center gap-2 text-sm'},
            h('span',{style:{fontSize:'1rem'}},ok?'✅':'🔴'),
            h('span',{className:ok?'text-gray-300':'text-gray-500'},r.label),
            h('span',{className:'text-xs text-gray-600 ml-auto'},r.weight+'%'));
        }))),

    // Simulator
    h(Simulator,{readings:p.readings,settings:p.settings,activeMeasureId:simId}),

    // Filters
    h('div',{className:'flex flex-wrap gap-2 items-center'},
      h('span',{className:'text-xs text-gray-500'},'Kategorie:'),
      cats.map(function(c){return h('button',{key:c,className:'nav-btn '+(filt.cat===c?'nav-active':'nav-inactive'),
        style:{fontSize:'.75rem',padding:'.3rem .7rem'},onClick:function(){setFilt(function(f){return Object.assign({},f,{cat:c});});}},c);}),
      h('span',{className:'text-xs text-gray-500 ml-4'},'Priorität:'),
      prios.map(function(pr){return h('button',{key:pr,className:'nav-btn '+(filt.prio===pr?'nav-active':'nav-inactive'),
        style:{fontSize:'.75rem',padding:'.3rem .7rem'},
        onClick:function(){setFilt(function(f){return Object.assign({},f,{prio:pr});});}},
        pr==='Alle'?'Alle':prioLabel[pr]);})),

    // Measure cards
    h('div',null,
      filtered.length===0?h('div',{className:'card text-gray-500 text-center py-8'},'Keine Maßnahmen für diesen Filter.')
        :filtered.map(function(m){
          return h(MeasureCard,{key:m.id,measure:m,onSimulate:function(id){setSimId(id);}});
        })),

    // Roadmap
    h(KarlRoadmap));
}

    head:[['Massnahme','Kategorie','Prioritaet','Frist','Investition','Aufwand']],
    body:measures.map(function(m){
      return[m.title,m.cat,prioLabel[m.prio]||m.prio,String(m.deadline),m.invest,{low:'Niedrig',medium:'Mittel',high:'Hoch'}[m.effort]||m.effort];
    }),
  }));
  pdfFooter(doc,3);

  doc.addPage();
  pdfHeader(doc,'KARL-Fristenplan 2025–2045',plant,4);
  doc.autoTable(Object.assign({},PDF_TBL,{
    startY:23,
    head:[['Jahr','Anforderung','Relevanz','Artikel'],],
    body:[
      ['2025','EU-Richtlinie 2024/3019 tritt in Kraft','Alle Anlagen','KARL Art. 1'],
      ['2027','Bewirtschaftungsplan Niederschlagswasser','Alle Anlagen','KARL Art. 5'],
      ['2027','Erstes Energieaudit (Pflicht)','Alle Anlagen >500 EW','KARL Art. 11'],
      ['2028','Virenmonitoring Pflicht','Anlagen >10.000 EW','KARL Art. 21'],
      ['2030','4. Reinigungsstufe','Anlagen >150.000 EW','KARL Art. 8'],
      ['2035','Verschaerfte N/P-Grenzwerte','Alle Anlagen','KARL Anhang I'],
      ['2035','4. Reinigungsstufe','Anlagen 10.000–150.000 EW','KARL Art. 8'],
      ['2039','4. Reinigungsstufe','Alle Anlagen >10.000 EW','KARL Art. 8'],
      ['2040','Energieneutralitaet','Alle Anlagen','KARL Art. 11'],
    ],
  }));
  var yf4=doc.lastAutoTable.finalY+8;
  doc.setFontSize(8);doc.setTextColor.apply(doc,PDF_GRAY);
  doc.text('Anlage '+settings.plantName+' (GK '+settings.sizeClass+'): '+
    (kpis.connectedEW>10000?'4. Reinigungsstufe bis 2039 relevant.':'4. Reinigungsstufe ggf. nicht relevant (<10.000 EW pruefen).'),10,yf4);
  doc.text('Foerderdatenbank: foerderdatenbank.de · Naechstes Energieaudit bis 2027',10,yf4+6);
  pdfFooter(doc,4);
  doc.save('KARL_Handlungsplan_'+settings.sizeClass+'_'+new Date().getFullYear()+'.pdf');
}

// ── Berichte ──────────────────────────────────────────────────────────────
function Berichte(p){
  var genState=useState({});var gen=genState[0],setGen=genState[1];
  function doGen(id,fn){
    if(!window.jspdf){alert('PDF-Bibliothek noch nicht geladen. Bitte kurz warten und erneut versuchen.');return;}
    setGen(function(prev){var n=Object.assign({},prev);n[id]=true;return n;});
    setTimeout(function(){
      try{fn(p.readings,p.settings);}catch(e){console.error('PDF error:',e);alert('PDF-Fehler: '+e.message);}
      setGen(function(prev){var n=Object.assign({},prev);n[id]=false;return n;});
    },50);
  }
  var reports=[
    {id:'jahresbericht',icon:'🏛️',color:'#0ea5e9',title:'Jahresbericht Wasserwirtschaftsamt',
     desc:'Pflichtbericht für Behörden: THG-Bilanz, Grenzwert-Compliance, Kennzahlen (4 Seiten)',
     badge:'Behörde · KARL Art. 15',fn:generateJahresbericht},
    {id:'energiebericht',icon:'⚡',color:'#f59e0b',title:'Energiebericht (KARL Art. 11)',
     desc:'Pflichtbericht: Stromverbrauch, Eigenversorgung, DWA-Benchmarking (3 Seiten)',
     badge:'Pflicht · Frist 2027',fn:generateEnergiebericht},
    {id:'klimabilanz',icon:'🌡️',color:'#ef4444',title:'Klimabilanz GHG-Protocol',
     desc:'Scope 1/2/3 vollständig, spezifische Emissionen, Jahresübersicht (3 Seiten)',
     badge:'GHG-Protocol · IPCC AR6',fn:generateKlimabilanz},
    {id:'handlungsplan',icon:'🗂️',color:'#6366f1',title:'Handlungsplan-Zusammenfassung',
     desc:'KARL-Readiness, priorisierte Maßnahmen, Fristen 2025–2045 (4 Seiten)',
     badge:'KARL Compliance',fn:generateHandlungsplan},
  ];
  var noData=!p.readings.length;
  return h('div',{className:'space-y-6'},
    h('h2',{className:'text-lg font-semibold text-sky-300'},'Berichte & Dokumentation'),
    h('div',{className:'card',style:{background:'#1e3a4a',borderColor:'#0ea5e9'}},
      h('div',{className:'text-xs text-sky-400 uppercase font-semibold mb-1'},'Hinweis'),
      h('span',{className:'text-sm text-gray-300'},
        'PDFs werden vollständig im Browser erstellt – keine Serverdaten. Alle Berichte enthalten das Erstellungsdatum und sind für Behördeneinreichungen formatiert.')),
    noData&&h('div',{className:'card text-gray-500 text-center py-8'},'Bitte zuerst Daten laden (Tab 📥 Daten → Demodaten laden).'),
    h('div',{className:'grid gap-4',style:{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}},
      reports.map(function(r){
        var loading=gen[r.id];
        return h('div',{className:'card',key:r.id},
          h('div',{style:{display:'flex',alignItems:'center',gap:'.75rem',marginBottom:'.75rem'}},
            h('div',{style:{fontSize:'2rem'}},r.icon),
            h('div',null,
              h('div',{className:'font-semibold text-white text-sm'},r.title),
              h('div',{style:{fontSize:'.7rem',background:'#0f172a',color:r.color,padding:'1px 8px',borderRadius:'999px',display:'inline-block',marginTop:'.2rem'}},r.badge))),
          h('div',{className:'text-sm text-gray-400 mb-4'},r.desc),
          h('button',{
            className:'nav-btn '+(noData||loading?'nav-inactive':'nav-active'),
            style:{width:'100%',opacity:noData?0.4:1},
            disabled:noData||loading,
            onClick:function(){doGen(r.id,r.fn);}},
            loading?'⏳ PDF wird erstellt...':'📄 PDF herunterladen'));
      })),
    h('div',{className:'card',style:{borderColor:'#334155'}},
      h('div',{className:'text-xs text-gray-500 uppercase font-semibold mb-2'},'Enthaltene Daten je Bericht'),
      h('table',null,
        h('thead',null,h('tr',null,
          h('th',null,'Bericht'),h('th',null,'Seiten'),h('th',null,'Inhalt'),h('th',null,'Rechtsgrundlage'))),
        h('tbody',null,[
          ['Jahresbericht','4','THG-Bilanz, Scopes, Grenzwerte, Compliance-Tabellen','EU-Richtlinie 2024/3019, AbwV'],
          ['Energiebericht','3','Stromverbrauch, Eigenversorgung, Benchmarking','KARL Art. 11'],
          ['Klimabilanz','3','Scope 1/2/3 Aufschlüsselung, monatliche Zeitreihe','GHG-Protocol, IPCC AR6'],
          ['Handlungsplan','4','KARL-Readiness, Maßnahmen, Fristen 2025–2045','KARL Art. 5, 8, 11, 21'],
        ].map(function(r,i){
          return h('tr',{key:i},r.map(function(c,j){return h('td',{key:j},c);}));
        })))));
}

var TABS=[
  {id:'dashboard',label:'📊 Dashboard'},{id:'klimabilanz',label:'🌡️ Klimabilanz'},
  {id:'grenzwerte',label:'⚠️ Grenzwerte'},{id:'energie',label:'⚡ Energie'},
  {id:'benchmarking',label:'📈 Benchmarking'},{id:'handlungsplan',label:'🗂️ Handlungsplan'},
  {id:'berichte',label:'📄 Berichte'},{id:'import',label:'📥 Daten'}];

function App(){
  var sa=useReducer(reducer,INIT);var st=sa[0],dis=sa[1];
  var ik=useState(null);var infoKey=ik[0],setInfoKey=ik[1];
  var ld=useCallback(function(){dis({type:'SET',p:demo(st.settings.sizeClass)});},[st.settings.sizeClass]);
  var onInfo=useCallback(function(k){setInfoKey(k);},[]);
  var onClose=useCallback(function(){setInfoKey(null);},[]);
  return h('div',{style:{maxWidth:'1100px',margin:'0 auto',padding:'1.5rem'}},
    infoKey&&h(InfoModal,{ik:infoKey,onClose:onClose}),
    h('div',{className:'flex flex-wrap items-center justify-between gap-3 mb-6'},
      h('div',null,
        h('h1',{className:'text-2xl font-bold text-sky-400'},'KARL-Dashboard'),
        h('p',{className:'text-xs text-gray-500'},'EU-Richtlinie 2024/3019 · GHG-Protocol · IPCC AR6')),
      h('div',{className:'flex flex-wrap gap-2'},
        TABS.map(function(t){return h(NBtn,{key:t.id,id:t.id,label:t.label,active:st.activeTab===t.id,
          onClick:function(id){dis({type:'TAB',p:id});}});}))),
    st.activeTab==='dashboard'    &&h(Dashboard,    {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='klimabilanz'  &&h(Klimabilanz,  {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='grenzwerte'   &&h(Grenzwerte,   {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='energie'      &&h(Energie,      {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='benchmarking' &&h(Benchmarking, {readings:st.readings,settings:st.settings}),
    st.activeTab==='handlungsplan'&&h(Handlungsplan,{readings:st.readings,settings:st.settings}),
    st.activeTab==='berichte'     &&h(Berichte,     {readings:st.readings,settings:st.settings}),
    st.activeTab==='import'       &&h(Datenimport,  {dispatch:dis,settings:st.settings,onLoadDemo:ld}));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
})();
</script>
