<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARL-Dashboard – Klimabilanz & Compliance für Kläranlagen</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .sidebar-btn { transition: background 0.15s, color 0.15s; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useReducer, useMemo, useRef } = React;
    const {
      LineChart, Line, BarChart, Bar, AreaChart, Area,
      XAxis, YAxis, CartesianGrid, Tooltip, Legend,
      ResponsiveContainer, ReferenceLine, ComposedChart,
      PieChart, Pie, Cell
    } = Recharts;

    // ── CONSTANTS ────────────────────────────────────────────────
    const KARL_LIMITS = {
      CSB:  { GK1:150, GK2:125, GK3:90,  GK4:75,  GK5:75  },
      BSB5: { GK1:25,  GK2:25,  GK3:20,  GK4:15,  GK5:10  },
      SS:   { GK1:150, GK2:35,  GK3:35,  GK4:20,  GK5:20  },
      TN:   {                   GK3:15,  GK4:13,  GK5:10  },
      TP:   {                   GK3:2,   GK4:1,   GK5:1   },
      NH4:  {                   GK3:10,  GK4:10,  GK5:10  },
    };

    const KARL_DEADLINES = [
      { id:'natlaw',    name:'Umsetzung in nationales Recht',          year:2027, desc:'EU-KARL-RL in deutsches Recht überführen' },
      { id:'virus',     name:'Virenmonitoring Pflicht',                 year:2028, desc:'Monitoring auf Viren & Antibiotikaresistenz' },
      { id:'stage4a',   name:'4. Reinigungsstufe (>150.000 EW)',        year:2033, desc:'Spurenstoffentfernung große Anlagen' },
      { id:'nutrients', name:'Verschärfte N/P-Grenzwerte',              year:2035, desc:'TN 13 mg/L, TP 1 mg/L für GK4' },
      { id:'stage4b',   name:'4. Reinigungsstufe (10.000–150.000 EW)', year:2039, desc:'Spurenstoffentfernung mittlere Anlagen' },
      { id:'energy',    name:'Energieneutralität',                      year:2040, desc:'Eigenversorgungsgrad ≥ 100%' },
    ];

    const MO = ['Jan','Feb','Mrz','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    const fmt = (m) => { if (!m) return ''; const [y,mo]=m.split('-'); return `${MO[+mo-1]} ${y}`; };

    // ── SAMPLE DATA ───────────────────────────────────────────────
    function generateSampleData() {
      const rows = [];
      // deterministic pseudo-random using a simple LCG so values are stable on reload
      let seed = 42;
      const rng = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; };
      const rnd = (base, pct) => base * (1 + (rng() - 0.5) * 2 * pct);

      for (let y = 2023; y <= 2024; y++) {
        for (let m = 1; m <= 12; m++) {
          const mi = (y - 2023) * 12 + (m - 1);           // 0..23
          const season = Math.cos(((m - 1) / 11) * Math.PI * 2); // peak winter
          const solarFactor = mi < 6 ? 0 : Math.min(1, (mi - 6) / 8);
          const biogasPeak = (m >= 9 && m <= 11) ? 1.15 : 1.0;
          const tpViol = (y === 2023 && m <= 2) || (y === 2023 && m === 11);
          const tnHigh = y === 2023 && m === 12;

          rows.push({
            month: `${y}-${String(m).padStart(2,'0')}`,
            plantName: 'KA Musterstadt',
            sizeClass: 'GK4',
            connectedEW: 45000,
            inflowVolume:   Math.round(rnd(180000 + season*15000, 0.04)),
            inflowCSB:      Math.round(rnd(375 + season*20, 0.04)),
            inflowTN:       +rnd(47 + season*3, 0.04).toFixed(1),
            inflowTP:       +rnd(7.1 + season*0.3, 0.03).toFixed(1),
            inflowNH4:      +rnd(31 + season*2, 0.04).toFixed(1),
            effluentCSB:    Math.round(rnd(27 + season*3, 0.06)),
            effluentBSB5:   +rnd(5.5 + season*0.5, 0.08).toFixed(1),
            effluentTN:     +rnd(tnHigh ? 13.5 : 10.8 + season*1.5, 0.05).toFixed(1),
            effluentTP:     +rnd(tpViol ? 1.15 : 0.82 + season*0.1, 0.06).toFixed(2),
            effluentNH4:    +rnd(1.7 + season*0.3, 0.08).toFixed(1),
            effluentSS:     Math.round(rnd(11 + season*2, 0.07)),
            powerConsumption: Math.round(rnd(148000 + season*12000, 0.04)),
            powerGeneration:  Math.round(rnd(40000 + solarFactor*18000 - season*3000, 0.05)),
            gridEmissionFactor: 380,
            biogas:         Math.round(rnd(27000 * biogasPeak, 0.06)),
            biogasMethane:  65,
            heatOil:        Math.round(rnd(season > 0 ? 400 + season*300 : 0, 0.1)),
            sludgeDisposal: Math.round(rnd(41 + season*3, 0.05)),
            sludgeTransport: 35,
            ironSulfate:    +rnd(3.1 + season*0.3, 0.07).toFixed(1),
            polyelectrolyte: +rnd(0.78 + season*0.05, 0.06).toFixed(2),
            combinedSewerOverflow: Math.round(rnd(1100 - season*200, 0.15)),
            rainfall:       Math.round(rnd(65 - season*15, 0.2)),
            virusMonitoring: m % 3 === 0,
            energyAuditDue: y === 2024 && m === 6,
          });
        }
      }
      return rows;
    }

    // ── CALCULATIONS ─────────────────────────────────────────────
    function calculateEmissions(r, s = {}) {
      const gwp_n2o = s.gwp_n2o || 273;
      const gwp_ch4 = s.gwp_ch4 || 27.9;
      const ef_t = s.ef_transport || 0.092;
      const ef_fe = s.ef_ironsulfate || 0.3;
      const ef_pe = s.ef_polyelectrolyte || 2.5;

      const nLoad = (r.inflowTN / 1000) * r.inflowVolume;
      const n2o_kg = nLoad * 0.016 * (44 / 28);
      const n2o = n2o_kg * gwp_n2o / 1000;

      const ch4_m3 = r.biogas * (r.biogasMethane / 100) * 0.02;
      const ch4 = ch4_m3 * 0.717 * gwp_ch4 / 1000;

      const heatoil = (r.heatOil || 0) * 2.65 / 1000;
      const scope1 = n2o + ch4 + heatoil;

      const netPower = r.powerConsumption - r.powerGeneration;
      const power = (netPower * r.gridEmissionFactor) / 1e6;
      const scope2 = power;

      const sludge = (r.sludgeDisposal * r.sludgeTransport * ef_t) / 1000;
      const chemicals = r.ironSulfate * ef_fe + r.polyelectrolyte * ef_pe;
      const scope3 = sludge + chemicals;

      const total = scope1 + scope2 + scope3;
      return { scope1, scope2, scope3, total, n2o, ch4, heatoil, power, sludge, chemicals,
               specific: total / (r.connectedEW / 1000) };
    }

    function checkCompliance(r) {
      const sc = r.sizeClass;
      const checks = [
        { param:'CSB',  value:r.effluentCSB,  limit:KARL_LIMITS.CSB[sc],  unit:'mg/L' },
        { param:'BSB₅', value:r.effluentBSB5, limit:KARL_LIMITS.BSB5[sc], unit:'mg/L' },
        { param:'SS',   value:r.effluentSS,   limit:KARL_LIMITS.SS[sc],   unit:'mg/L' },
        { param:'TN',   value:r.effluentTN,   limit:KARL_LIMITS.TN[sc],   unit:'mg/L' },
        { param:'TP',   value:r.effluentTP,   limit:KARL_LIMITS.TP[sc],   unit:'mg/L' },
        { param:'NH₄',  value:r.effluentNH4,  limit:KARL_LIMITS.NH4[sc],  unit:'mg/L' },
      ].filter(c => c.limit != null);
      const violations = checks.filter(c => c.value > c.limit);
      const score = Math.round(((checks.length - violations.length) / checks.length) * 100);
      const status = score >= 95 ? 'green' : score >= 85 ? 'yellow' : 'red';
      return { score, violations, status, checks };
    }

    // ── STATE ─────────────────────────────────────────────────────
    const init = {
      readings: [], activeTab: 'dashboard',
      settings: { gwp_n2o:273, gwp_ch4:27.9, ef_transport:0.092, ef_ironsulfate:0.3, ef_polyelectrolyte:2.5 },
    };
    function reducer(st, a) {
      switch (a.type) {
        case 'SET_READINGS': return { ...st, readings: a.payload };
        case 'SET_TAB':      return { ...st, activeTab: a.payload };
        case 'CLEAR':        return { ...st, readings: [] };
        case 'SET_SETTING':  return { ...st, settings: { ...st.settings, [a.key]: +a.value } };
        default: return st;
      }
    }

    // ── SHARED COMPONENTS ─────────────────────────────────────────
    function KPICard({ title, value, unit, sub, color='blue', trend }) {
      const c = { blue:'text-blue-700', green:'text-green-600', red:'text-red-600', yellow:'text-yellow-600', orange:'text-orange-500' };
      return (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
          <p className="text-xs text-gray-500 font-medium uppercase tracking-wide">{title}</p>
          <div className="flex items-end gap-2 mt-1">
            <span className={`text-3xl font-bold ${c[color]||c.blue}`}>{value}</span>
            <span className="text-gray-400 text-sm mb-0.5">{unit}</span>
            {trend != null && <span className={`text-sm mb-0.5 font-medium ${trend>0?'text-red-500':'text-green-500'}`}>{trend>0?'↑':'↓'}{Math.abs(trend).toFixed(1)}%</span>}
          </div>
          {sub && <p className="text-xs text-gray-400 mt-1">{sub}</p>}
        </div>
      );
    }

    function EmptyState({ onNav }) {
      return (
        <div className="flex flex-col items-center justify-center h-64 text-center bg-white rounded-xl border border-dashed border-gray-300 p-8">
          <div className="text-5xl mb-3">📊</div>
          <h3 className="text-lg font-semibold text-gray-700 mb-2">Keine Daten geladen</h3>
          <p className="text-gray-500 text-sm mb-4">Laden Sie Beispieldaten oder importieren Sie eine CSV-Datei, um loszulegen.</p>
          <button onClick={() => onNav('import')} className="bg-blue-700 text-white px-6 py-2 rounded-lg hover:bg-blue-800 transition text-sm font-medium">
            Zum Datenimport →
          </button>
        </div>
      );
    }

    // ── DASHBOARD ─────────────────────────────────────────────────
    function DashboardPage({ readings, settings, onNav }) {
      const enriched = useMemo(() =>
        readings.map(r => ({ ...r, ...calculateEmissions(r, settings), comp: checkCompliance(r) })),
        [readings, settings]
      );

      const chartData = useMemo(() => enriched.map(d => ({
        name: fmt(d.month),
        s1: +d.scope1.toFixed(2), s2: +d.scope2.toFixed(2), s3: +d.scope3.toFixed(2),
        total: +d.total.toFixed(2),
        comp: d.comp.score,
        cf: d.comp.status === 'green' ? '#22c55e' : d.comp.status === 'yellow' ? '#eab308' : '#ef4444',
      })), [enriched]);

      if (!readings.length) return <EmptyState onNav={onNav} />;

      const last = enriched[enriched.length - 1];
      const prev = enriched[enriched.length - 2];
      const trend = prev ? ((last.total - prev.total) / Math.abs(prev.total)) * 100 : 0;
      const autarky = Math.round((last.powerGeneration / last.powerConsumption) * 100);
      const nextDl = KARL_DEADLINES.filter(d => d.year > new Date().getFullYear()).sort((a,b) => a.year-b.year)[0];
      const now = new Date().getFullYear();

      return (
        <div className="space-y-5">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <KPICard title="Gesamtemissionen (letzter Monat)" value={last.total.toFixed(1)} unit="t CO₂e" trend={trend} color="blue" />
            <KPICard title="Compliance-Score" value={last.comp.score} unit="%" color={last.comp.status==='green'?'green':last.comp.status==='yellow'?'yellow':'red'}
              sub={last.comp.violations.length ? `${last.comp.violations.length} Überschreitung(en)` : 'Alle Grenzwerte eingehalten'} />
            <KPICard title="Energieautarkie" value={autarky} unit="%" color={autarky>=100?'green':autarky>=60?'yellow':'orange'} sub="Eigenerzeugung / Verbrauch" />
            <KPICard title="Nächste KARL-Frist" value={nextDl?.year||'–'} unit="" color="blue" sub={nextDl?.name||''} />
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-4">Treibhausgasemissionen – Zeitreihe</h2>
            <ResponsiveContainer width="100%" height={270}>
              <ComposedChart data={chartData} margin={{top:4,right:8,left:0,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                <XAxis dataKey="name" tick={{fontSize:10}} />
                <YAxis tick={{fontSize:10}} unit=" t" width={55} />
                <Tooltip formatter={(v,n) => [`${v} t CO₂e`, n]} />
                <Legend wrapperStyle={{fontSize:12}} />
                <Area type="monotone" dataKey="s1" name="Scope 1 (direkt)" stackId="1" fill="#fecaca" stroke="#ef4444" fillOpacity={0.8} />
                <Area type="monotone" dataKey="s2" name="Scope 2 (Strom)" stackId="1" fill="#fed7aa" stroke="#f97316" fillOpacity={0.8} />
                <Area type="monotone" dataKey="s3" name="Scope 3 (Kette)" stackId="1" fill="#fef08a" stroke="#eab308" fillOpacity={0.8} />
                <Line type="monotone" dataKey="total" name="Gesamt" stroke="#1d4ed8" strokeWidth={2.5} dot={false} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-4">Compliance-Verlauf</h2>
            <ResponsiveContainer width="100%" height={190}>
              <BarChart data={chartData} margin={{top:4,right:8,left:0,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                <XAxis dataKey="name" tick={{fontSize:10}} />
                <YAxis domain={[70,100]} tick={{fontSize:10}} unit="%" width={38} />
                <Tooltip formatter={(v) => [`${v}%`, 'Compliance-Score']} />
                <ReferenceLine y={95} stroke="#22c55e" strokeDasharray="5 3" label={{value:'95%',fill:'#16a34a',fontSize:10,position:'insideTopRight'}} />
                <ReferenceLine y={85} stroke="#eab308" strokeDasharray="5 3" label={{value:'85%',fill:'#ca8a04',fontSize:10,position:'insideTopRight'}} />
                <Bar dataKey="comp" name="Score" radius={[4,4,0,0]}>
                  {chartData.map((d,i) => <Cell key={i} fill={d.cf} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-4">KARL-Fristen Übersicht</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="bg-gray-50 text-left">
                  {['Anforderung','Frist','Verbleibend','Status'].map(h=><th key={h} className="px-4 py-2 text-gray-600 font-medium">{h}</th>)}
                </tr></thead>
                <tbody>
                  {KARL_DEADLINES.map(d => {
                    const rem = d.year - now;
                    return (
                      <tr key={d.id} className="border-t border-gray-100">
                        <td className="px-4 py-3"><p className="font-medium text-gray-800">{d.name}</p><p className="text-xs text-gray-400">{d.desc}</p></td>
                        <td className="px-4 py-3 font-medium">{d.year}</td>
                        <td className="px-4 py-3 text-gray-600">{rem<0?'Überfällig':rem===0?'Dieses Jahr':`${rem} Jahr(e)`}</td>
                        <td className="px-4 py-3">
                          {rem<0 ? <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-xs font-semibold">🔴 Überfällig</span>
                           : rem<=3 ? <span className="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full text-xs font-semibold">⚠️ In Planung</span>
                           : <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs font-semibold">✅ Frist offen</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ── KLIMABILANZ ───────────────────────────────────────────────
    function KlimabilanzPage({ readings, settings, onNav }) {
      const [view, setView] = useState('monthly');
      const enriched = useMemo(() => readings.map(r => ({ ...r, ...calculateEmissions(r, settings) })), [readings, settings]);

      const chartData = useMemo(() => {
        if (view === 'monthly') return enriched.map(d => ({
          name: fmt(d.month),
          n2o: +d.n2o.toFixed(3), ch4: +d.ch4.toFixed(3), heatoil: +d.heatoil.toFixed(3),
          power: +d.power.toFixed(2), sludge: +d.sludge.toFixed(2), chemicals: +d.chemicals.toFixed(2),
          total: +d.total.toFixed(2),
        }));
        const yrs = {};
        enriched.forEach(d => {
          const y = d.month.split('-')[0];
          if (!yrs[y]) yrs[y] = { name:y, n2o:0, ch4:0, heatoil:0, power:0, sludge:0, chemicals:0, total:0 };
          ['n2o','ch4','heatoil','power','sludge','chemicals','total'].forEach(k => yrs[y][k] += d[k]);
        });
        return Object.values(yrs).map(y => ({
          ...y, n2o:+y.n2o.toFixed(2), ch4:+y.ch4.toFixed(2), power:+y.power.toFixed(2),
          sludge:+y.sludge.toFixed(2), chemicals:+y.chemicals.toFixed(2), total:+y.total.toFixed(2),
        }));
      }, [enriched, view]);

      if (!readings.length) return <EmptyState onNav={onNav} />;
      const last = enriched[enriched.length-1];

      return (
        <div className="space-y-5">
          <div className="grid grid-cols-3 gap-4">
            {[
              {label:'Scope 1 – Direkt', val:last.scope1.toFixed(2), sub:'N₂O + CH₄-Leckage + Heizöl', bg:'bg-red-50', border:'border-red-200', tc:'text-red-600', sc:'text-red-500 text-xs font-semibold', lc:'text-red-700'},
              {label:'Scope 2 – Strom',  val:last.scope2.toFixed(2), sub:'Nettostromverbrauch × EF',    bg:'bg-orange-50', border:'border-orange-200', tc:'text-orange-600', sc:'text-orange-500 text-xs font-semibold', lc:'text-orange-700'},
              {label:'Scope 3 – Kette',  val:last.scope3.toFixed(2), sub:'Schlamm-Transport + Chemikalien', bg:'bg-yellow-50', border:'border-yellow-200', tc:'text-yellow-600', sc:'text-yellow-500 text-xs font-semibold', lc:'text-yellow-700'},
            ].map(s => (
              <div key={s.label} className={`${s.bg} border ${s.border} rounded-xl p-4`}>
                <p className={`text-xs font-semibold uppercase tracking-wide ${s.lc}`}>{s.label}</p>
                <p className={`text-2xl font-bold ${s.tc} mt-1`}>{s.val} <span className="text-sm font-normal">t CO₂e</span></p>
                <p className={`${s.sc} mt-1`}>{s.sub}</p>
              </div>
            ))}
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-base font-semibold text-gray-800">THG-Emissionen nach Quellen</h2>
              <div className="flex gap-2">
                {['monthly','yearly'].map(v => (
                  <button key={v} onClick={() => setView(v)} className={`px-3 py-1 rounded-lg text-xs font-medium transition ${view===v?'bg-blue-700 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                    {v==='monthly'?'Monatlich':'Jährlich'}
                  </button>
                ))}
              </div>
            </div>
            <ResponsiveContainer width="100%" height={290}>
              <BarChart data={chartData} margin={{top:4,right:8,left:0,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                <XAxis dataKey="name" tick={{fontSize:10}} />
                <YAxis tick={{fontSize:10}} unit=" t" width={55} />
                <Tooltip formatter={(v,n) => [`${v} t CO₂e`, n]} />
                <Legend wrapperStyle={{fontSize:11}} />
                <Bar dataKey="n2o"       name="N₂O (Lachgas)"    stackId="a" fill="#fca5a5" />
                <Bar dataKey="ch4"       name="CH₄ (Methan)"     stackId="a" fill="#ef4444" />
                <Bar dataKey="heatoil"   name="Heizöl"           stackId="a" fill="#7f1d1d" />
                <Bar dataKey="power"     name="Strom (netto)"    stackId="a" fill="#f97316" />
                <Bar dataKey="sludge"    name="Schlamm-Transport" stackId="a" fill="#fbbf24" />
                <Bar dataKey="chemicals" name="Chemikalien"      stackId="a" fill="#eab308" radius={[4,4,0,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
            <p className="font-semibold text-blue-800 mb-2 text-sm">ℹ️ Scope-Erklärung (GHG Protocol)</p>
            <div className="grid grid-cols-3 gap-4 text-xs text-blue-700">
              <p><strong>Scope 1:</strong> Direkte Emissionen aus eigenen Quellen (N₂O aus Nitrifikation, CH₄-Leckage aus Faultürmen, Heizöl)</p>
              <p><strong>Scope 2:</strong> Indirekte Emissionen aus zugekaufter Energie (Netto-Stromverbrauch × CO₂-Faktor des Strommixes)</p>
              <p><strong>Scope 3:</strong> Vor-/nachgelagerte Emissionen in der Lieferkette (Schlamm-Transport per LKW, Betriebsstoffe FeSO₄ & Polyelektrolyt)</p>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-3">Monatliche Detailtabelle</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead><tr className="bg-gray-50">
                  {['Monat','N₂O','CH₄','Heizöl','Strom','Schlamm','Chemikl.','Gesamt','Spez.'].map(h => <th key={h} className="px-3 py-2 text-left text-gray-600 font-medium whitespace-nowrap">{h}</th>)}
                </tr></thead>
                <tbody>

    // ── GRENZWERTE ────────────────────────────────────────────────
    function GrenzwertePage({ readings, onNav }) {
      const [activeP, setActiveP] = useState('TP');
      const PARAMS = [
        { key:'TN',  label:'TN',   field:'effluentTN',  lk:'TN',  inflow:'inflowTN'  },
        { key:'TP',  label:'TP',   field:'effluentTP',  lk:'TP',  inflow:'inflowTP'  },
        { key:'CSB', label:'CSB',  field:'effluentCSB', lk:'CSB', inflow:'inflowCSB' },
        { key:'BSB', label:'BSB₅', field:'effluentBSB5',lk:'BSB5',inflow:null        },
        { key:'NH4', label:'NH₄',  field:'effluentNH4', lk:'NH4', inflow:'inflowNH4' },
        { key:'SS',  label:'SS',   field:'effluentSS',  lk:'SS',  inflow:null        },
      ];
      if (!readings.length) return <EmptyState onNav={onNav} />;

      const sc = readings[0].sizeClass;
      const ap = PARAMS.find(p => p.key === activeP);
      const limit = KARL_LIMITS[ap.lk]?.[sc];

      const chartData = readings.map(r => {
        const v = r[ap.field];
        return { name:fmt(r.month), value:v, limit, over: v > limit ? v : null };
      });

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <div className="flex gap-2 flex-wrap">
              {PARAMS.map(p => (
                <button key={p.key} onClick={() => setActiveP(p.key)}
                  className={`px-4 py-1.5 rounded-lg text-sm font-medium transition ${activeP===p.key?'bg-blue-700 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                  {p.label}
                </button>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-1">
              {ap.label} Ablauf – Zeitreihe
              <span className="ml-2 text-sm font-normal text-gray-400">Grenzwert {sc}: {limit ?? '–'} mg/L</span>
            </h2>
            <ResponsiveContainer width="100%" height={270}>
              <ComposedChart data={chartData} margin={{top:4,right:8,left:0,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                <XAxis dataKey="name" tick={{fontSize:10}} />
                <YAxis tick={{fontSize:10}} unit=" mg/L" width={52} />
                <Tooltip formatter={(v,n) => [`${v} mg/L`, n]} />
                <Legend wrapperStyle={{fontSize:11}} />
                <Line type="monotone" dataKey="value" name={`${ap.label} Ablauf`} stroke="#1d4ed8" strokeWidth={2} dot={(props) => {
                  const {cx,cy,payload} = props;
                  return payload.over
                    ? <circle key={`c${cx}`} cx={cx} cy={cy} r={5} fill="#ef4444" stroke="#fff" strokeWidth={1.5} />
                    : <circle key={`c${cx}`} cx={cx} cy={cy} r={3} fill="#1d4ed8" />;
                }} />
                {limit != null && <ReferenceLine y={limit} stroke="#ef4444" strokeDasharray="6 3"
                  label={{value:`GW: ${limit}`,fill:'#ef4444',fontSize:10,position:'insideTopRight'}} />}
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-3">Monatswerte {ap.label}</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="bg-gray-50 text-left">
                  {['Monat', ap.inflow&&'Zulauf [mg/L]', 'Ablauf [mg/L]', 'Grenzwert', ap.inflow&&'Elimination', 'Status'].filter(Boolean).map(h => (
                    <th key={h} className="px-3 py-2 text-gray-600 font-medium">{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {readings.map((r,i) => {
                    const val = r[ap.field];
                    const inf = ap.inflow ? r[ap.inflow] : null;
                    const elim = inf ? Math.round((1 - val/inf)*100) : null;
                    const ok = limit == null || val <= limit;
                    return (
                      <tr key={i} className={`border-t border-gray-100 ${!ok?'bg-red-50':''}`}>
                        <td className="px-3 py-2 whitespace-nowrap font-medium">{fmt(r.month)}</td>
                        {ap.inflow && <td className="px-3 py-2">{inf}</td>}
                        <td className={`px-3 py-2 font-semibold ${!ok?'text-red-600':'text-green-700'}`}>{val}</td>
                        <td className="px-3 py-2 text-gray-500">{limit ?? '–'}</td>
                        {ap.inflow && <td className="px-3 py-2">{elim != null ? `${elim}%` : '–'}</td>}
                        <td className="px-3 py-2">
                          {ok ? <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded-full text-xs">✓ OK</span>
                              : <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-xs">✗ +{((val-limit)/limit*100).toFixed(1)}%</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-3">KARL-Grenzwertübersicht (GK4)</h2>
            <table className="w-full text-sm">
              <thead><tr className="bg-gray-50">
                {['Parameter','Aktuell (91/271) [mg/L]','KARL (2024/3019) [mg/L]','KARL-Status'].map(h => (
                  <th key={h} className="px-3 py-2 text-left text-gray-600 font-medium">{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {[
                  {p:'CSB',  curr:75,  karl:75,  year:null},
                  {p:'BSB₅', curr:15,  karl:15,  year:null},
                  {p:'SS',   curr:20,  karl:20,  year:null},
                  {p:'TN',   curr:15,  karl:13,  year:2035},
                  {p:'TP',   curr:2,   karl:1,   year:2035},
                  {p:'NH₄',  curr:10,  karl:10,  year:null},
                ].map(row => (
                  <tr key={row.p} className="border-t border-gray-100">
                    <td className="px-3 py-2 font-medium">{row.p}</td>
                    <td className="px-3 py-2">{row.curr}</td>
                    <td className="px-3 py-2 font-semibold text-blue-700">{row.karl}</td>
                    <td className="px-3 py-2">
                      {row.year
                        ? <span className="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full text-xs">⚠️ Anpassung bis {row.year}</span>
                        : <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded-full text-xs">✅ Bereits konform</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── ENERGIE ───────────────────────────────────────────────────
    function EnergiePage({ readings, settings, onNav }) {
      const chartData = useMemo(() => readings.map(r => {
        const autarky = Math.round((r.powerGeneration / r.powerConsumption) * 100);
        const avoided = +(r.powerGeneration * r.gridEmissionFactor / 1e6).toFixed(2);
        return { name:fmt(r.month), verbrauch:r.powerConsumption, erzeugung:r.powerGeneration, autarky, avoided };
      }), [readings]);

      if (!readings.length) return <EmptyState onNav={onNav} />;

      const lastR = readings[readings.length-1];
      const lastA = chartData[chartData.length-1].autarky;
      const cumAvoided = chartData.reduce((s,d) => s+d.avoided, 0);

      const biogasKwh = lastR.biogas * (lastR.biogasMethane/100) * 10 * 0.35;
      const solarKwh = Math.max(0, lastR.powerGeneration - biogasKwh);
      const pieData = [
        { name:'BHKW (Klärgas)', value:Math.round(biogasKwh), color:'#f97316' },
        { name:'Photovoltaik',   value:Math.round(solarKwh),  color:'#22c55e' },
      ].filter(d => d.value > 0);

      return (
        <div className="space-y-5">
          <div className="grid grid-cols-3 gap-4">
            <KPICard title="Aktueller Autarkiegrad" value={lastA} unit="%" color={lastA>=100?'green':lastA>=60?'yellow':'orange'} sub="Ziel KARL 2040: 100%" />
            <KPICard title="Kum. vermiedene Emissionen" value={cumAvoided.toFixed(1)} unit="t CO₂e" color="green" sub="Durch Eigenerzeugung seit Jan 2023" />
            <KPICard title="Nächstes Energieaudit" value="Jun 2028" unit="" color="blue" sub="KARL-Pflicht: alle 4 Jahre" />
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-4">Energiebilanz – Zeitreihe</h2>
            <ResponsiveContainer width="100%" height={290}>
              <ComposedChart data={chartData} margin={{top:4,right:40,left:0,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                <XAxis dataKey="name" tick={{fontSize:10}} />
                <YAxis yAxisId="l" tick={{fontSize:10}} unit=" kWh" width={62} />
                <YAxis yAxisId="r" orientation="right" tick={{fontSize:10}} unit="%" domain={[0,120]} width={38} />
                <Tooltip />
                <Legend wrapperStyle={{fontSize:11}} />
                <Bar yAxisId="l" dataKey="verbrauch" name="Verbrauch [kWh]" fill="#fecaca" />
                <Bar yAxisId="l" dataKey="erzeugung" name="Eigenerzeugung [kWh]" fill="#bbf7d0" />
                <Line yAxisId="r" type="monotone" dataKey="autarky" name="Autarkiegrad [%]" stroke="#1d4ed8" strokeWidth={2.5} dot={false} />
                <ReferenceLine yAxisId="r" y={100} stroke="#22c55e" strokeDasharray="6 3"
                  label={{value:'100% Ziel',fill:'#16a34a',fontSize:10,position:'insideTopRight'}} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          <div className="grid grid-cols-2 gap-5">
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
              <h2 className="text-base font-semibold text-gray-800 mb-4">Eigenerzeugung (letzter Monat)</h2>
              <ResponsiveContainer width="100%" height={200}>
                <PieChart>
                  <Pie data={pieData} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={75}
                    label={({name,percent}) => `${(percent*100).toFixed(0)}%`}>
                    {pieData.map((d,i) => <Cell key={i} fill={d.color} />)}
                  </Pie>
                  <Tooltip formatter={v => [`${v.toLocaleString('de-DE')} kWh`]} />
                  <Legend wrapperStyle={{fontSize:11}} />
                </PieChart>
              </ResponsiveContainer>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
              <h2 className="text-base font-semibold text-gray-800 mb-4">Energieaudit-Checkliste</h2>
              <div className="space-y-2.5">
                {[
                  ['Belüftungsoptimierung', true],
                  ['Biogasnutzung optimiert', true],
                  ['Photovoltaik installiert', true],
                  ['Abwärmerückgewinnung', false],
                  ['Frequenzumrichter Pumpen', false],
                  ['Energiemanagementsystem ISO 50001', false],
                ].map(([label,done],i) => (
                  <div key={i} className="flex items-center gap-3">
                    <span className={`w-5 h-5 rounded flex items-center justify-center text-xs flex-shrink-0 font-bold ${done?'bg-green-500 text-white':'bg-gray-200 text-gray-400'}`}>
                      {done?'✓':'–'}
                    </span>
                    <span className={`text-sm ${done?'text-gray-800':'text-gray-400'}`}>{label}</span>
                  </div>
                ))}
              </div>
              <p className="text-xs text-gray-400 mt-4">Letztes Audit: Jun 2024 · Nächstes: Jun 2028</p>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-800 mb-4">Vermiedene Emissionen durch Eigenerzeugung</h2>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={chartData} margin={{top:4,right:8,left:0,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                <XAxis dataKey="name" tick={{fontSize:10}} />
                <YAxis tick={{fontSize:10}} unit=" t" width={45} />
                <Tooltip formatter={v => [`${v} t CO₂e`, 'Vermiedene Emissionen']} />

              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    // ── DATENIMPORT ───────────────────────────────────────────────
    function DatenimportPage({ readings, onLoad, onClear }) {
      const [tab, setTab] = useState('examples');
      const [preview, setPreview] = useState(null);
      const [error, setError] = useState(null);
      const fileRef = useRef(null);

      const REQUIRED = ['month','inflowVolume','effluentTN','effluentTP','powerConsumption','powerGeneration'];
      const DEFAULTS = {
        plantName:'Importierte Anlage', sizeClass:'GK4', connectedEW:45000,
        inflowNH4:30, inflowCSB:350, inflowTN:45, inflowTP:7,
        effluentCSB:30, effluentBSB5:6, effluentNH4:2, effluentSS:12,
        gridEmissionFactor:380, biogasMethane:65, sludgeTransport:35,
        ironSulfate:3, polyelectrolyte:0.8, heatOil:0, digesters:2,
        biogas:25000, sludgeDisposal:40, combinedSewerOverflow:1000,
        rainfall:65, virusMonitoring:false, energyAuditDue:false,
      };

      const parseCSV = (text) => {
        const lines = text.trim().split('\n').filter(l => l.trim());
        if (lines.length < 2) throw new Error('CSV enthält zu wenige Zeilen');
        const headers = lines[0].split(',').map(h => h.trim());
        const missing = REQUIRED.filter(r => !headers.includes(r));
        if (missing.length) throw new Error(`Fehlende Pflichtfelder: ${missing.join(', ')}`);
        return lines.slice(1).map(line => {
          const vals = line.split(',');
          const obj = {};
          headers.forEach((h,i) => { const v = vals[i]?.trim(); obj[h] = v === undefined ? undefined : isNaN(v) ? v : parseFloat(v); });
          return { ...DEFAULTS, ...obj };
        });
      };

      const handleFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try { setPreview(parseCSV(ev.target.result)); setError(null); }
          catch (err) { setError(err.message); setPreview(null); }
        };
        reader.readAsText(file);
      };

      const exportCSV = () => {
        if (!readings.length) return;
        const keys = Object.keys(readings[0]);
        const csv = [keys.join(','), ...readings.map(r => keys.map(k => r[k] ?? '').join(','))].join('\n');
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv],{type:'text/csv'})), download:'karl_daten.csv' });
        a.click();
      };

      const CSV_EXAMPLE = `month,inflowVolume,inflowCSB,inflowTN,inflowTP,effluentCSB,effluentBSB5,effluentTN,effluentTP,powerConsumption,powerGeneration,gridEmissionFactor,biogas,biogasMethane,sludgeDisposal,sludgeTransport
2024-01,180000,380,48,7.2,28,6,11.2,0.9,148000,52000,380,28000,65,42,35
2024-02,165000,360,45,6.8,25,5,10.8,0.85,142000,48000,380,26000,65,38,35`;

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <div className="flex gap-2">
              {[['examples','📊 Beispieldaten'],['csv','📁 CSV-Import'],['overview','📋 Datenübersicht']].map(([k,l]) => (
                <button key={k} onClick={() => setTab(k)}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition ${tab===k?'bg-blue-700 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          {tab === 'examples' && (
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-10 text-center">
              <div className="text-6xl mb-4">🏭</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-2">KA Musterstadt – Beispieldaten</h2>
              <p className="text-gray-500 mb-6 max-w-lg mx-auto text-sm">
                Vollständige Zeitreihe einer fiktiven Kläranlage GK4 mit 45.000 Einwohnerwerten für 24 Monate.
              </p>
              <div className="grid grid-cols-2 gap-2.5 max-w-md mx-auto mb-8 text-left">
                {[
                  '24 Monate Zeitreihe (Jan 2023 – Dez 2024)',
                  'Realistische saisonale Schwankungen',
                  '3 simulierte TP-Grenzwertüberschreitungen',
                  'Steigende Eigenerzeugung (Solar nachgerüstet)',
                  'Klärgas-Spitze im Herbst (höhere Faulung)',
                  'Trend zur Energieneutralität sichtbar',
                ].map((f,i) => (
                  <div key={i} className="flex items-start gap-2 text-sm text-gray-700">
                    <span className="text-green-500 flex-shrink-0 mt-0.5">✓</span>{f}
                  </div>
                ))}
              </div>
              <button onClick={() => { onLoad(generateSampleData()); setTab('overview'); }}
                className="bg-blue-700 text-white px-8 py-3 rounded-xl text-base font-semibold hover:bg-blue-800 transition shadow-md">
                📊 Beispieldaten laden
              </button>
              <p className="text-xs text-gray-400 mt-4">Daten werden nur im Browser gespeichert – kein Server-Upload</p>
            </div>
          )}

          {tab === 'csv' && (
            <div className="space-y-4">
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h2 className="text-base font-semibold text-gray-800 mb-4">CSV-Datei importieren</h2>
                <div onClick={() => fileRef.current?.click()}
                  className="border-2 border-dashed border-gray-300 rounded-xl p-10 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition">
                  <div className="text-4xl mb-2">📁</div>
                  <p className="text-gray-600 font-medium text-sm">CSV-Datei auswählen</p>
                  <p className="text-gray-400 text-xs mt-1">UTF-8 kodierte CSV mit Komma-Trennzeichen</p>
                  <input ref={fileRef} type="file" accept=".csv,.txt" className="hidden" onChange={handleFile} />
                </div>
                {error && <div className="mt-3 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">⚠️ {error}</div>}
                {preview && (
                  <div className="mt-4">
                    <p className="text-sm text-green-700 font-medium mb-2">✓ {preview.length} Zeilen erkannt – Vorschau (erste 5):</p>
                    <div className="overflow-x-auto">
                      <table className="text-xs w-full border border-gray-200 rounded">
                        <thead className="bg-gray-50">
                          <tr>{['Monat','Zulauf m³','TN Abl.','TP Abl.','Verbr. kWh','Erz. kWh'].map(h=><th key={h} className="px-2 py-1.5 text-left text-gray-600">{h}</th>)}</tr>
                        </thead>
                        <tbody>
                          {preview.slice(0,5).map((r,i) => (
                            <tr key={i} className="border-t border-gray-100">
                              <td className="px-2 py-1.5">{r.month}</td>
                              <td className="px-2 py-1.5">{r.inflowVolume?.toLocaleString('de-DE')}</td>
                              <td className="px-2 py-1.5">{r.effluentTN}</td>
                              <td className={`px-2 py-1.5 ${r.effluentTP>1?'text-red-600 font-semibold':''}`}>{r.effluentTP}</td>
                              <td className="px-2 py-1.5">{r.powerConsumption?.toLocaleString('de-DE')}</td>
                              <td className="px-2 py-1.5 text-green-700">{r.powerGeneration?.toLocaleString('de-DE')}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <button onClick={() => { onLoad(preview); setTab('overview'); }}
                      className="mt-3 bg-blue-700 text-white px-6 py-2 rounded-lg hover:bg-blue-800 transition text-sm font-medium">
                      Daten laden ({preview.length} Monate)
                    </button>
                  </div>
                )}
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h3 className="font-semibold text-gray-800 mb-3 text-sm">Erwartetes CSV-Format</h3>
                <pre className="bg-gray-900 text-green-400 text-xs p-4 rounded-lg overflow-x-auto leading-relaxed">{CSV_EXAMPLE}</pre>
                <div className="mt-4 grid grid-cols-2 gap-x-8 gap-y-1 text-xs text-gray-600">
                  {[['month','YYYY-MM Format (Pflicht)'],['inflowVolume','Abwasserzulauf [m³/Monat]'],['effluentTN','TN Ablauf [mg/L]'],['effluentTP','TP Ablauf [mg/L]'],
                    ['powerConsumption','Stromverbrauch [kWh]'],['powerGeneration','Eigenerzeugung [kWh]'],['biogas','Klärgas [m³/Monat]'],['sludgeDisposal','Klärschlamm [t/Monat]']
                  ].map(([k,v]) => <p key={k}><code className="bg-gray-100 px-1 rounded">{k}</code> → {v}</p>)}
                </div>
              </div>
            </div>
          )}

          {tab === 'overview' && (
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-base font-semibold text-gray-800">Geladene Daten ({readings.length} Monate)</h2>
                {readings.length > 0 && (
                  <div className="flex gap-2">
                    <button onClick={exportCSV} className="px-4 py-1.5 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition font-medium">↓ CSV exportieren</button>
                    <button onClick={onClear} className="px-4 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm hover:bg-red-200 transition font-medium">Daten löschen</button>
                  </div>
                )}
              </div>
              {readings.length === 0
                ? <p className="text-gray-500 text-center py-12 text-sm">Noch keine Daten geladen.</p>
                : (
                  <div className="overflow-auto max-h-96">
                    <table className="w-full text-sm">
                      <thead className="bg-gray-50 sticky top-0">
                        <tr>
                          {['Monat','Anlage','Zulauf m³','CSB','TN','TP','Verbr. kWh','Erz. kWh','Autarkie'].map(h => (
                            <th key={h} className="px-3 py-2 text-left text-gray-600 font-medium whitespace-nowrap text-xs">{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {readings.map((r,i) => {
                          const aut = Math.round((r.powerGeneration/r.powerConsumption)*100);
                          return (
                            <tr key={i} className="border-t border-gray-100 hover:bg-gray-50">
                              <td className="px-3 py-1.5 whitespace-nowrap text-xs">{fmt(r.month)}</td>
                              <td className="px-3 py-1.5 text-xs">{r.plantName}</td>
                              <td className="px-3 py-1.5 text-xs">{r.inflowVolume?.toLocaleString('de-DE')}</td>
                              <td className="px-3 py-1.5 text-xs">{r.effluentCSB}</td>
                              <td className="px-3 py-1.5 text-xs">{r.effluentTN}</td>
                              <td className={`px-3 py-1.5 text-xs font-medium ${r.effluentTP>1?'text-red-600':'text-gray-800'}`}>{r.effluentTP}</td>
                              <td className="px-3 py-1.5 text-xs">{r.powerConsumption?.toLocaleString('de-DE')}</td>
                              <td className="px-3 py-1.5 text-xs text-green-700">{r.powerGeneration?.toLocaleString('de-DE')}</td>
                              <td className={`px-3 py-1.5 text-xs font-medium ${aut>=100?'text-green-600':aut>=60?'text-yellow-600':'text-red-600'}`}>{aut}%</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
            </div>
          )}
        </div>
      );
    }

    // ── ROOT APP ──────────────────────────────────────────────────
    function App() {
      const [state, dispatch] = useReducer(reducer, init);
      const nav = (tab) => dispatch({ type:'SET_TAB', payload:tab });

      const NAV = [
        { id:'dashboard',   icon:'🏠', label:'Dashboard'   },
        { id:'klimabilanz', icon:'🌿', label:'Klimabilanz'  },
        { id:'grenzwerte',  icon:'📏', label:'Grenzwerte'   },
        { id:'energie',     icon:'⚡', label:'Energie'      },
        { id:'import',      icon:'📥', label:'Datenimport'  },
      ];

      const plant = state.readings[0];
      const props = { readings:state.readings, settings:state.settings, onNav:nav };

      const PAGE = {
        dashboard:   <DashboardPage   {...props} />,
        klimabilanz: <KlimabilanzPage {...props} />,
        grenzwerte:  <GrenzwertePage  {...props} />,
        energie:     <EnergiePage     {...props} />,
        import: (
          <DatenimportPage
            readings={state.readings}
            onLoad={d => dispatch({ type:'SET_READINGS', payload:d })}
            onClear={() => dispatch({ type:'CLEAR' })}
          />
        ),
      };

      return (
        <div className="flex h-screen overflow-hidden bg-gray-50">
          {/* Sidebar */}
          <aside className="w-52 bg-blue-900 text-white flex flex-col flex-shrink-0 shadow-xl">
            <div className="px-4 py-5 border-b border-blue-800">
              <div className="flex items-center gap-2.5">
                <span className="text-3xl">💧</span>
                <div>
                  <h1 className="font-bold text-lg leading-tight">KARL</h1>
                  <p className="text-blue-400 text-xs leading-tight">Compliance Dashboard</p>
                </div>
              </div>
            </div>
            <nav className="flex-1 p-3 space-y-0.5">
              {NAV.map(item => (
                <button key={item.id} onClick={() => nav(item.id)}
                  className={`sidebar-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium ${
                    state.activeTab===item.id ? 'bg-blue-700 text-white' : 'text-blue-200 hover:bg-blue-800 hover:text-white'
                  }`}>
                  <span className="text-base">{item.icon}</span>{item.label}
                </button>
              ))}
            </nav>
            <div className="p-3 border-t border-blue-800 space-y-0.5">
              <p className="text-blue-400 text-xs">EU-KARL RL 2024/3019</p>
              <p className="text-blue-500 text-xs">KlicK-Tool Erweiterung</p>
            </div>
          </aside>

          {/* Content */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {/* Header */}
            <header className="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between flex-shrink-0">
              <div>
                <h2 className="font-semibold text-gray-800">{NAV.find(n=>n.id===state.activeTab)?.label}</h2>
                <p className="text-xs text-gray-400">Klimabilanz & KARL-Compliance für Kläranlagen</p>
              </div>
              <div className="flex items-center gap-3">
                {plant ? (
                  <div className="text-right">
                    <p className="text-sm font-medium text-gray-800">{plant.plantName}</p>
                    <p className="text-xs text-gray-400">{plant.sizeClass} · {plant.connectedEW?.toLocaleString('de-DE')} EW · {state.readings.length} Monate</p>
                  </div>
                ) : (
                  <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 flex items-center gap-2">
                    <span className="text-amber-500 text-sm">⚠️</span>
                    <span className="text-amber-700 text-sm">Keine Daten –</span>
                    <button onClick={() => nav('import')} className="text-blue-600 text-sm underline hover:text-blue-800 font-medium">Beispieldaten laden</button>
                  </div>
                )}
              </div>
            </header>

            {/* Page */}
            <main className="flex-1 overflow-auto p-6">
              {PAGE[state.activeTab]}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
