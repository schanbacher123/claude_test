// ── Reducer ───────────────────────────────────────────────────────────────
function reducer(st,a){
  if(a.type==='SET')    return Object.assign({},st,{readings:a.p});
  if(a.type==='ADD')    return Object.assign({},st,{readings:st.readings.concat([a.p])});
  if(a.type==='TAB')    return Object.assign({},st,{activeTab:a.p});
  if(a.type==='SET_CFG')return Object.assign({},st,{settings:Object.assign({},st.settings,a.p)});
  if(a.type==='CLEAR')  return Object.assign({},st,{readings:[]});
  return st;
}

// ── Calculations ──────────────────────────────────────────────────────────
function calcEm(r,s){
  var n2o=(r.inflowTN/1000)*r.inflowVolume*0.016*(44/28)*s.gwp_n2o/1000;
  var ch4=r.biogas*(r.biogasMethane/100)*0.02*0.717*s.gwp_ch4/1000;
  var oil=(r.heatOil||0)*2.65/1000;
  var s1=n2o+ch4+oil;
  var s2=Math.max(0,(r.powerConsumption-r.powerGeneration)*r.gridEmissionFactor/1e6);
  var sl=(r.sludgeDisposal*r.sludgeTransport*s.ef_transport)/1000;
  var ch=r.ironSulfate*s.ef_iron+r.polyelectrolyte*s.ef_poly;
  var s3=sl+ch;
  var tot=s1+s2+s3;
  return{s1:s1,s2:s2,s3:s3,tot:tot,n2o:n2o,ch4:ch4,oil:oil,pwr:s2,sl:sl,ch:ch,
         sp:r.connectedEW>0?tot/(r.connectedEW/1000):0};
}
function calcComp(r,sc){
  var chk=[
    {p:'CSB',v:r.effluentCSB,lim:KL.CSB[sc]},
    {p:'BSB5',v:r.effluentBSB5,lim:KL.BSB5[sc]},
    {p:'SS',v:r.effluentSS,lim:KL.SS[sc]},
    {p:'TN',v:r.effluentTN,lim:KL.TN[sc]},
    {p:'TP',v:r.effluentTP,lim:KL.TP[sc]},
    {p:'NH4',v:r.effluentNH4,lim:KL.NH4[sc]},
  ].filter(function(c){return c.lim!=null;});
  var viol=chk.filter(function(c){return c.v>c.lim;});
  var score=chk.length?Math.round(((chk.length-viol.length)/chk.length)*100):100;
  return{score:score,viol:viol,status:score>=95?'g':score>=80?'y':'r'};
}

      effluentTN:(KL.TN[sc]||13)*(0.5+rng()*0.6),
      effluentTP:(KL.TP[sc]||1)*(0.4+rng()*0.8),
      effluentNH4:(KL.NH4[sc]||10)*(0.3+rng()*0.7),
      powerConsumption:EW*0.04*(0.85+rng()*0.3),
      powerGeneration:EW*0.015*(0.8+rng()*0.4),

  });
}

function f(n,d){d=d==null?1:d;return typeof n==='number'&&!isNaN(n)?n.toFixed(d):'–';}
function fd(r){return MO[r.month]+' '+r.year;}
function g(cond,a,b){return cond?a:(b||null);}

// ── Chart wrapper ─────────────────────────────────────────────────────────
function CChart(p){
  var ref=useRef(null);var inst=useRef(null);
  var key=JSON.stringify(p.cfg);
  useEffect(function(){
    if(!ref.current)return;
    if(inst.current){try{inst.current.destroy();}catch(e){} inst.current=null;}
    try{inst.current=new Chart(ref.current,p.cfg);}catch(e){console.error('Chart error:',e);}
    return function(){if(inst.current){try{inst.current.destroy();}catch(e){} inst.current=null;}};
  },[key]);
  return h('div',{style:{position:'relative',height:(p.h||220)+'px'}},
    h('canvas',{ref:ref}));
}

// ── Info Modal ────────────────────────────────────────────────────────────
function InfoModal(p){
  var info=INFO[p.ik];

  return h('div',{className:'modal-overlay',onClick:function(e){if(e.target===e.currentTarget)p.onClose();}},

function Datenimport(p){
  var fr=useRef(null);
  var ms=useState('');var msg=ms[0],setMsg=ms[1];
  var fs=useState(Object.assign({},EF));var form=fs[0],setForm=fs[1];
  function setF(k,v){setForm(function(prev){var n=Object.assign({},prev);n[k]=v;return n;});}
  function csv(e){
    var fl=e.target.files[0];if(!fl)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      try{
        var lines=ev.target.result.split('\n').filter(Boolean);
        var hd=lines[0].split(';').map(function(x){return x.trim();});
        var rows=lines.slice(1).map(function(l,id){
          var vs=l.split(';'),o={id:id};
          hd.forEach(function(hh,i){o[hh]=isNaN(vs[i])?vs[i]:Number(vs[i]);});
          return o;
        }).filter(function(r){return r.year&&r.month!=null;});
        p.dispatch({type:'SET',p:rows});setMsg(rows.length+' Einträge importiert.');
      }catch(err){setMsg('Fehler: '+err.message);}
    };
    rd.readAsText(fl);
  }
  var SF=[['plantName','Anlagenname','text'],['gwp_n2o','GWP N₂O','number'],
    ['gwp_ch4','GWP CH₄','number'],['ef_transport','EF Transport','number'],
    ['ef_iron','EF Eisensulfat','number'],['ef_poly','EF Polyelektrolyt','number']];
  return h('div',{className:'space-y-6'},
    h('h2',{className:'text-lg font-semibold text-sky-300'},'Datenimport'),
    h('div',{className:'grid gap-4',style:{gridTemplateColumns:'1fr 1fr 1fr'}},
      h('button',{className:'card text-center cursor-pointer',style:{cursor:'pointer'},onClick:p.onLoadDemo},
        h('div',{style:{fontSize:'2rem',marginBottom:'.5rem'}},'🗃️'),
        h('div',{className:'font-semibold text-sky-300'},'Demodaten laden'),
        h('div',{className:'text-xs text-gray-500 mt-1'},'24 Monate synthetische Daten')),
      h('div',{className:'card'},
        h('div',{className:'font-semibold text-gray-300 mb-2'},'📂 CSV importieren'),
        h('div',{className:'text-xs text-gray-500 mb-3'},'Semikolon als Trennzeichen.'),
        h('input',{type:'file',accept:'.csv',ref:fr,onChange:csv,style:{display:'none'}}),
        h('button',{className:'nav-btn nav-inactive',style:{width:'100%'},onClick:function(){fr.current.click();}},'Datei wählen…')),
      h('button',{className:'card text-center',style:{cursor:'pointer'},
        onClick:function(){p.dispatch({type:'CLEAR'});setMsg('Daten gelöscht.');}},
        h('div',{style:{fontSize:'2rem',marginBottom:'.5rem'}},'🗑️'),
        h('div',{className:'font-semibold text-red-400'},'Daten löschen'),
        h('div',{className:'text-xs text-gray-500 mt-1'},'Alle Einträge entfernen'))),
    g(msg,h('div',{className:'card text-sm text-green-400'},msg)),
    h('div',{className:'card'},
      h('div',{className:'font-semibold text-gray-300 mb-4'},'Manuelle Dateneingabe'),
      h('div',{className:'grid gap-3',style:{gridTemplateColumns:'repeat(auto-fit,minmax(155px,1fr))'}},
        MF.map(function(fl){
          return h('div',{key:fl[0]},
            h('label',{className:'text-xs text-gray-500 block mb-1'},fl[1]),
            h('input',{type:'number',className:'w-full',value:form[fl[0]],
              onChange:function(e){var v=e.target.value;setF(fl[0],v===''?v:isNaN(v)?v:Number(v));}}));
        })),
      h('button',{className:'nav-btn nav-active',style:{marginTop:'1rem'},
        onClick:function(){p.dispatch({type:'ADD',p:Object.assign({},form,{id:Date.now()})});setMsg('Eintrag hinzugefügt.');}},
        'Eintrag speichern')),
    h('div',{className:'card'},
      h('div',{className:'font-semibold text-gray-300 mb-3'},'Anlageneinstellungen'),
      h('div',{className:'grid gap-3',style:{gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}},
        SF.map(function(fl){
          return h('div',{key:fl[0]},
            h('label',{className:'text-xs text-gray-500 block mb-1'},fl[1]),
            h('input',{type:fl[2],className:'w-full',value:p.settings[fl[0]],
              onChange:function(e){var o={};o[fl[0]]=fl[2]==='number'?Number(e.target.value):e.target.value;
                p.dispatch({type:'SET_CFG',p:o});}}));
        }),
        h('div',null,
          h('label',{className:'text-xs text-gray-500 block mb-1'},'Größenklasse'),
          h('select',{className:'w-full',value:p.settings.sizeClass,
            onChange:function(e){p.dispatch({type:'SET_CFG',p:{sizeClass:e.target.value}});}},
            SC.map(function(s){return h('option',{key:s,value:s},s);}))))));
}

// ── App ───────────────────────────────────────────────────────────────────
var TABS=[
  {id:'dashboard',label:'📊 Dashboard'},{id:'klimabilanz',label:'🌡️ Klimabilanz'},
  {id:'grenzwerte',label:'⚠️ Grenzwerte'},{id:'energie',label:'⚡ Energie'},
  {id:'import',label:'📥 Daten'}];

function App(){
  var sa=useReducer(reducer,INIT);var st=sa[0],dis=sa[1];
  var ik=useState(null);var infoKey=ik[0],setInfoKey=ik[1];
  var ld=useCallback(function(){dis({type:'SET',p:demo(st.settings.sizeClass)});},[st.settings.sizeClass]);
  var onInfo=useCallback(function(k){setInfoKey(k);},[]);
  var onClose=useCallback(function(){setInfoKey(null);},[]);
  return h('div',{style:{maxWidth:'1100px',margin:'0 auto',padding:'1.5rem'}},
    infoKey&&h(InfoModal,{ik:infoKey,onClose:onClose}),
    h('div',{className:'flex flex-wrap items-center justify-between gap-3 mb-6'},
      h('div',null,
        h('h1',{className:'text-2xl font-bold text-sky-400'},'KARL-Dashboard'),
        h('p',{className:'text-xs text-gray-500'},'EU-Richtlinie 2024/3019 · GHG-Protocol · IPCC AR6')),
      h('div',{className:'flex flex-wrap gap-2'},
        TABS.map(function(t){return h(NBtn,{key:t.id,id:t.id,label:t.label,active:st.activeTab===t.id,
          onClick:function(id){dis({type:'TAB',p:id});}});}))),
    st.activeTab==='dashboard'  &&h(Dashboard,  {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='klimabilanz'&&h(Klimabilanz, {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='grenzwerte' &&h(Grenzwerte,  {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='energie'    &&h(Energie,     {readings:st.readings,settings:st.settings,onInfo:onInfo}),
    st.activeTab==='import'     &&h(Datenimport, {dispatch:dis,settings:st.settings,onLoadDemo:ld}));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
})();
</script>
</body>
</html>
