<script>

    // Opake Cross-Origin-Fehler (z. B. aus CDN-Skripten) liefern keine Details

    var opaque = !err && (line === 0 || !src);
    var d = document.getElementById('root');
    if (opaque || (d && d.childElementCount > 0)) {
      if (window.console) console.warn('Script-Fehler ignoriert (App laeuft weiter):', msg);

/* ---------- Helpers ---------- */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let CUR_LANG = 'de';
const fmt = (n) => CUR_LANG === 'en'
  ? '€' + Math.round(n).toLocaleString('en-US')
  : Math.round(n).toLocaleString('de-DE') + ' €';
const pct = (n) => n.toLocaleString(CUR_LANG === 'en' ? 'en-US' : 'de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';

const RENT_PER_UNIT = 15000;
const RE_BUY_FACTOR = 1.06; // 6 % Kaufnebenkosten (Grunderwerbsteuer, Notar, Makler)
const JOB_TITLES = ['Marketing Manager', 'CFO', 'Data Analyst', 'Software Engineer', 'Product Manager', 'Sales Director', 'UX Designer', 'Management Consultant', 'Financial Controller', 'Investment Analyst', 'Operations Lead', 'HR Manager'];
const FOUNDER_TITLES = ['Founder', 'Startup-CEO', 'Freelancer', 'Solo-Entrepreneur'];
const pickFrom = (arr, not) => { const o = arr.filter(x => x !== not); return o[Math.floor(Math.random() * o.length)] || arr[0]; };

/* Abgeleitete Finanzkennzahlen (rein, ohne Seiteneffekt) */
function derive(s){
  const stocksVal = s.stockUnits * s.stockPrice;
  const reVal = s.realEstateUnits * s.realEstatePrice;
  const rentIncome = s.realEstateUnits * RENT_PER_UNIT;
  const dividendIncome = stocksVal * (s.dividendYield / 100);
  const totalIncome = s.salary + rentIncome + dividendIncome;
  const interestExpenses = s.loans * (s.interestRate / 100);
  const childCosts = s.childCosts || 0;
  const totalExpenses = s.basisExpenses + childCosts + s.lifestyleSpend + interestExpenses;
  const netCashflow = totalIncome - totalExpenses;
  const netWorth = (s.cash + stocksVal + reVal) - s.loans;
  return { stocksVal, reVal, rentIncome, dividendIncome, totalIncome, interestExpenses, childCosts, totalExpenses, netCashflow, netWorth };
}

/* ---------- Initialer State ---------- */
function initialState(){
  return {
    gameState: 'modal',      // running | modal | gameover | won
    event: 'start',          // start | wedding | kids | null
    age: 16,
    cash: 0,
    loans: 0,
    salary: 0,
    jobTitle: '', selfEmployed: false, lastJobChangeAge: -1,
    basisExpenses: 30000, childCosts: 0,
    inflation: 2, interestRate: 3,
    stockPrice: 5000, realEstatePrice: 250000,
    stockUnits: 0, realEstateUnits: 0,
    dividendYield: 3,
    joy: 50, joyFloor: 0,
    lifestyleSpend: 0,
    stockQty: 1, realEstateQty: 1, kidsQty: 1,
    lang: 'de',
    endHidden: false,
    history: [],
    flags: { wedding: false, kids: false },
    log: [{ age: 16, text: T.de.L.start(), kind: 'info' }],
  };
}

function addLog(log, age, text, kind = 'info'){
  return [{ age, text, kind }, ...log].slice(0, 80);
}

/* ---------- Tick: ein Lebensjahr ---------- */
function advanceYear(prev){
  const d = derive(prev);
  const L = T[prev.lang].L;
  let log = prev.log;

  // Makro-Updates
  const newInflation = rand(1, 6);
  const newInterest = newInflation + rand(0, 3);
  const newBasis = prev.basisExpenses * (1 + newInflation / 100);
  const newChildCosts = (prev.childCosts || 0) * (1 + newInflation / 100);
  // Angestellt: stetiger Inflationsausgleich. Selbstständig: höher, aber volatil.
  const newSalary = prev.selfEmployed
    ? Math.max(0, prev.salary * (1 + rand(-30, 50) / 100))
    : prev.salary * 1.02;
  const newCash = prev.cash + d.netCashflow;

  // Aktienkurs & Immobilienkurs schwanken jährlich (immer, unabhängig vom Besitz)
  const stockChange = rand(-15, 20);
  const newStockPrice = prev.stockPrice * (1 + stockChange / 100);
  const reChange = rand(-8, 12);
  const newRealEstatePrice = prev.realEstatePrice * (1 + reChange / 100);
  // Dividendenrendite schwankt jährlich
  const newDividendYield = rand(1, 5);

  // Joy – Lebensfreude aus Heirat/Kindern (joyFloor) geht nicht zurück
  let joyDelta;
  if (prev.lifestyleSpend === 0) joyDelta = -5;
  else if (prev.lifestyleSpend > 15000) joyDelta = 5;
  else joyDelta = 1;
  const newJoy = clamp(prev.joy + joyDelta, prev.joyFloor, 100);

  const newAge = prev.age + 1;

  // Logs für das Jahr
  log = addLog(log, newAge, L.year(newInflation, newInterest, d.netCashflow), d.netCashflow >= 0 ? 'good' : 'bad');
  log = addLog(log, newAge, L.market(newStockPrice, stockChange, newRealEstatePrice, reChange), stockChange >= 0 ? 'good' : 'bad');
  if (d.dividendIncome > 0) {
    log = addLog(log, newAge, L.dividend(d.dividendIncome, prev.dividendYield), 'good');
  }

  let next = {
    ...prev,
    age: newAge,
    inflation: newInflation,
    interestRate: newInterest,
    basisExpenses: newBasis,
    childCosts: newChildCosts,
    salary: newSalary,
    cash: newCash,
    stockPrice: newStockPrice,
    realEstatePrice: newRealEstatePrice,
    dividendYield: newDividendYield,
    joy: newJoy,
    log,
  };

  // Game-Over-Prüfung + Verlaufspunkt: Privatinsolvenz nur bei negativem
  // Eigenkapital (mit positivem Eigenkapital könnten Assets verkauft werden).
  const nd = derive(next);
  next.history = [...prev.history, { age: newAge, assets: next.cash + nd.stocksVal + nd.reVal, liabilities: next.loans, equity: nd.netWorth, stockPrice: next.stockPrice, realEstatePrice: next.realEstatePrice }];
  if (nd.netWorth < 0) {
    next.gameState = 'gameover';
    next.event = null;
    next.log = addLog(next.log, newAge, L.bankrupt(), 'bad');
    return next;
  }

  // Gewonnen
  if (newAge >= END_AGE) {
    next.gameState = 'won';
    next.event = null;
    next.log = addLog(next.log, newAge, L.retired(nd.netWorth), 'good');
    return next;
  }

  // Lebensereignisse → Spiel pausieren
  if (newAge >= 28 && !next.flags.wedding) {
    next.gameState = 'modal';
    next.event = 'wedding';
  } else if (newAge >= 32 && !next.flags.kids) {
    next.gameState = 'modal';
    next.event = 'kids';
  }

  return next;
}

/* ---------- Generisches Liniendiagramm (selbst-enthaltenes SVG) ---------- */
function LineChart({ data, series, fmtVal, baseline, emptyText }){
  if (!data || data.length < 2) {
    return <div className="grid h-44 place-items-center text-sm text-slate-500">{emptyText}</div>;
  }
  const W = 760, H = 220, padL = 64, padR = 12, padT = 14, padB = 26;
  const minAge = data[0].age, maxAge = data[data.length - 1].age;
  const vals = [];
  data.forEach(p => series.forEach(se => vals.push(p[se.key])));
  if (baseline != null) vals.push(baseline);
  let maxV = Math.max(...vals);
  let minV = Math.min(...vals);
  if (maxV === minV) maxV = minV + 1;
  const x = (a) => padL + (maxAge === minAge ? 0 : (a - minAge) / (maxAge - minAge)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - minV) / (maxV - minV)) * (H - padT - padB);
  const path = (key) => data.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(p.age).toFixed(1)} ${y(p[key]).toFixed(1)}`).join(' ');
  const last = data[data.length - 1];
  const showBaseline = baseline != null && baseline > minV && baseline < maxV;
  return (
    <div>
      <div className="mb-2 flex flex-wrap gap-4">
        {series.map(se => (
          <span key={se.key} className="flex items-center gap-1.5 text-xs text-slate-400">
            <span className="inline-block h-2.5 w-3 rounded-sm" style={{ background: se.color }} />
            {se.label} <span className="tabular-nums font-semibold text-slate-200">{fmtVal(last[se.key])}</span>
          </span>
        ))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }} preserveAspectRatio="xMidYMid meet">
        <line x1={padL} y1={padT} x2={padL} y2={H - padB} stroke="#334155" strokeWidth="1" />
        <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke="#334155" strokeWidth="1" />
        {showBaseline && (
          <line x1={padL} y1={y(baseline)} x2={W - padR} y2={y(baseline)} stroke="#475569" strokeWidth="1" strokeDasharray="4 4" />
        )}
        <text x={padL - 6} y={y(maxV) + 4} textAnchor="end" fill="#64748b" fontSize="11">{fmtVal(maxV)}</text>
        <text x={padL - 6} y={y(minV) + 4} textAnchor="end" fill="#64748b" fontSize="11">{fmtVal(minV)}</text>
        <text x={padL} y={H - 8} textAnchor="start" fill="#64748b" fontSize="11">{minAge}</text>
        <text x={W - padR} y={H - 8} textAnchor="end" fill="#64748b" fontSize="11">{maxAge}</text>
        {series.map(se => (
          <path key={se.key} d={path(se.key)} fill="none" stroke={se.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        ))}
      </svg>
    </div>
  );
}

/* ---------- Haupt-App ---------- */
function App(){
  const [s, setS] = useState(initialState);
  const stateRef = useRef(s);
  stateRef.current = s;

  // Game Loop – pausiert automatisch, wenn nicht "running"
  useEffect(() => {
    if (s.gameState !== 'running') return;
    const id = setInterval(() => setS(prev => advanceYear(prev)), TICK_MS);
    return () => clearInterval(id);
  }, [s.gameState]);

  CUR_LANG = s.lang;
  const t = T[s.lang];
  const d = derive(s);
  const busy = s.gameState !== 'running';

  const priceData = s.history.length
    ? s.history.map(p => ({ age: p.age, stockIdx: p.stockPrice / s.history[0].stockPrice * 100, reIdx: p.realEstatePrice / s.history[0].realEstatePrice * 100 }))
    : [];

  const seedHistory = (st) => {
    const nd = derive(st);
    return [{ age: st.age, assets: st.cash + nd.stocksVal + nd.reVal, liabilities: st.loans, equity: nd.netWorth, stockPrice: st.stockPrice, realEstatePrice: st.realEstatePrice }];
  };

  const toggleLang = (lng) => setS(p => ({ ...p, lang: lng }));
  const hideEnd = () => setS(p => ({ ...p, endHidden: true }));
  const showEnd = () => setS(p => ({ ...p, endHidden: false }));

  /* --- Permanente Aktionen --- */
  const changeJob = () => setS(p => {
    if (p.gameState !== 'running' || p.lastJobChangeAge === p.age) return p;
    const L = T[p.lang].L;
    const title = pickFrom(JOB_TITLES, p.jobTitle);
    if (Math.random() < 0.15) {
      const salary = 20000;
      return { ...p, salary, jobTitle: title, selfEmployed: false, lastJobChangeAge: p.age, log: addLog(p.log, p.age, L.jobFail(title, salary), 'bad') };
    }
    const salary = p.salary * 1.10;
    return { ...p, salary, jobTitle: title, selfEmployed: false, lastJobChangeAge: p.age, log: addLog(p.log, p.age, L.jobOk(title, salary), 'good') };
  });

  const goSelfEmployed = () => setS(p => {
    if (p.gameState !== 'running' || p.selfEmployed || p.lastJobChangeAge === p.age) return p;
    const L = T[p.lang].L;
    const title = pickFrom(FOUNDER_TITLES, p.jobTitle);
    // Gleiches Gehalt zum Start – nur der jährliche Drift wird volatiler/positiver.
    return { ...p, selfEmployed: true, jobTitle: title, lastJobChangeAge: p.age, log: addLog(p.log, p.age, L.selfStart(title, p.salary), 'good') };
  });

  const buyStocks = (n) => setS(p => {
    if (p.gameState !== 'running') return p;
    const L = T[p.lang].L;
    const cost = n * p.stockPrice;
    if (p.cash < cost) return { ...p, log: addLog(p.log, p.age, L.stocksReject(cost), 'bad') };
    return { ...p, cash: p.cash - cost, stockUnits: p.stockUnits + n, log: addLog(p.log, p.age, L.stocksBuy(n, cost), 'good') };
  });

  const sellStocks = (n) => setS(p => {
    if (p.gameState !== 'running' || p.stockUnits <= 0) return p;
    const L = T[p.lang].L;
    const units = Math.min(n, p.stockUnits);
    const proceeds = units * p.stockPrice;
    return { ...p, cash: p.cash + proceeds, stockUnits: p.stockUnits - units, log: addLog(p.log, p.age, L.stocksSell(units, proceeds), 'good') };
  });

  const buyRealEstate = (n) => setS(p => {
    if (p.gameState !== 'running') return p;
    const L = T[p.lang].L;
    const fullPrice = n * p.realEstatePrice * RE_BUY_FACTOR;
    const down = fullPrice * 0.1;
    const loan = fullPrice * 0.9;
    if (p.cash < down) return { ...p, log: addLog(p.log, p.age, L.reReject(down), 'bad') };
    return {
      ...p,
      cash: p.cash - down,
      realEstateUnits: p.realEstateUnits + n,
      loans: p.loans + loan,
      log: addLog(p.log, p.age, L.reBuy(n, down, loan, RENT_PER_UNIT * n), 'good'),
    };
  });

  const sellRealEstate = (n) => setS(p => {
    if (p.gameState !== 'running' || p.realEstateUnits <= 0) return p;
    const L = T[p.lang].L;
    const units = Math.min(n, p.realEstateUnits);
    const proceeds = units * p.realEstatePrice;
    const repay = (p.loans / p.realEstateUnits) * units;
    return {
      ...p,
      cash: p.cash + proceeds - repay,
      loans: p.loans - repay,
      realEstateUnits: p.realEstateUnits - units,
      log: addLog(p.log, p.age, L.reSell(units, proceeds, repay), 'good'),
    };
  });

  const setLifestyle = (v) => setS(p => ({ ...p, lifestyleSpend: v }));
  const setStockQty = (v) => setS(p => ({ ...p, stockQty: v }));
  const setRealEstateQty = (v) => setS(p => ({ ...p, realEstateQty: v }));
  const setKidsQty = (v) => setS(p => ({ ...p, kidsQty: v }));

  /* --- Event-Entscheidungen --- */
  const chooseStart = (path) => setS(p => {
    const L = T[p.lang].L;
    const base = path === 'ausbildung'
      ? { ...p, gameState: 'running', event: null, age: 19, cash: 5000, salary: 24000, loans: 0, basisExpenses: 20000, jobTitle: 'Fachkraft', log: addLog(p.log, 19, L.apprenticeDone(), 'good') }
      : { ...p, gameState: 'running', event: null, age: 23, cash: 0, salary: 45000, loans: 10000, basisExpenses: 30000, jobTitle: 'Trainee', log: addLog(p.log, 23, L.universityDone(), 'good') };
    base.history = seedHistory(base);
    return base;
  });

  const chooseWedding = (yes) => setS(p => {
    const L = T[p.lang].L;
    const flags = { ...p.flags, wedding: true };
    if (!yes) return { ...p, gameState: 'running', event: null, flags, log: addLog(p.log, p.age, L.single(), 'info') };
    return { ...p, gameState: 'running', event: null, flags,
      cash: p.cash - 10000, basisExpenses: p.basisExpenses * 1.15,
      joyFloor: clamp(p.joyFloor + 20, 0, 100), joy: clamp(p.joy + 20, 0, 100),
      log: addLog(p.log, p.age, L.married(), 'good') };
  });

  const chooseKids = (yes) => setS(p => {
    const L = T[p.lang].L;
    const flags = { ...p.flags, kids: true };
    if (!yes) return { ...p, gameState: 'running', event: null, flags, log: addLog(p.log, p.age, L.noKids(), 'info') };
    const n = p.kidsQty;
    return { ...p, gameState: 'running', event: null, flags,
      cash: p.cash - 5000 * n, childCosts: (p.childCosts || 0) + 6000 * n,
      joyFloor: clamp(p.joyFloor + 15 * n, 0, 100), joy: clamp(p.joy + 15 * n, 0, 100),
      log: addLog(p.log, p.age, L.kids(n, 5000 * n, 6000 * n, Math.min(15 * n, 100)), 'good') };
  });

  const restart = () => setS(p => ({ ...initialState(), lang: p.lang, log: [{ age: 16, text: T[p.lang].L.start(), kind: 'info' }] }));

  /* ---------- Render ---------- */
  return (
    <div className="mx-auto max-w-7xl px-4 py-5">
      {/* Top-Bar */}
      <header className="mb-5 rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
        <div className="flex flex-wrap items-center gap-4 justify-between">
          <div className="flex items-center gap-3">
            <span className="grid place-items-center w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-400">
              <Icon name="Coins" size={22} />
            </span>
            <div>
              <h1 className="text-lg font-bold text-slate-100 leading-tight">Cashflow Life</h1>
              <p className="text-xs text-slate-500">{t.subtitle}</p>
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-5">
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wide text-slate-500">{t.age}</div>
              <div className="text-xl font-bold text-slate-100 tabular-nums">{s.age} <span className="text-sm text-slate-500">/ {END_AGE}</span></div>
            </div>
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wide text-slate-500 flex items-center gap-1 justify-center"><Icon name="TrendingUp" size={12} />{t.inflation}</div>
              <div className="text-xl font-bold text-amber-400 tabular-nums">{pct(s.inflation)}</div>
            </div>
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wide text-slate-500 flex items-center gap-1 justify-center"><Icon name="Landmark" size={12} />{t.interest}</div>
              <div className="text-xl font-bold text-sky-400 tabular-nums">{pct(s.interestRate)}</div>
            </div>
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wide text-slate-500 flex items-center gap-1 justify-center"><Icon name="Briefcase" size={12} />{t.jobLabel}</div>
              <div className="text-sm font-bold text-slate-100">{s.jobTitle || '—'}</div>
            </div>
            <div className="min-w-[150px]">
              <div className="text-[10px] uppercase tracking-wide text-slate-500 flex items-center gap-1 mb-1"><Icon name="Smile" size={12} />{t.joyTop} {Math.round(s.joy)}</div>
              <Bar value={s.joy} />
            </div>
            <div className="flex overflow-hidden rounded-lg border border-slate-700">
              {['de', 'en'].map(lng => (
                <button key={lng} onClick={() => toggleLang(lng)}
                  className={`px-2.5 py-1 text-xs font-bold uppercase transition ${s.lang === lng ? 'bg-emerald-500 text-slate-900' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}>
                  {lng}
                </button>
              ))}
            </div>
          </div>
        </div>
      </header>

      <div className="grid gap-4 lg:grid-cols-3">
        {/* Spalte Links – Financial Statement */}
        <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
          <h2 className="mb-2 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-slate-400">
            <Icon name="ScrollText" size={16} /> {t.guv}
          </h2>
          {(() => {
            const guvMax = Math.max(s.salary, d.rentIncome, d.dividendIncome, d.totalExpenses, 1);
            return (
              <div>
                <FinBar label={t.salaryLbl} value={s.salary} max={guvMax} barClass="bg-emerald-500" valClass="text-emerald-400" icon="Banknote" sign="+ " info={t.info.salary} />
                <FinBar label={t.rentLbl} value={d.rentIncome} max={guvMax} barClass="bg-teal-500" valClass="text-teal-300" icon="Building2" sign="+ " info={t.info.rent} />
                <FinBar label={t.dividendLbl} value={d.dividendIncome} max={guvMax} barClass="bg-sky-500" valClass="text-sky-300" icon="TrendingUp" sign="+ " info={t.info.dividend} />
                <FinBar label={t.livingCostsLbl} value={s.basisExpenses} max={guvMax} barClass="bg-rose-500" valClass="text-rose-300" icon="ShoppingBag" sign="− " info={t.info.livingCosts} />
                {d.childCosts > 0 && <FinBar label={t.childCostsLbl} value={d.childCosts} max={guvMax} barClass="bg-orange-500" valClass="text-orange-300" icon="Baby" sign="− " info={t.info.childCosts} />}
                <FinBar label={t.interestExp} value={d.interestExpenses} max={guvMax} barClass="bg-amber-500" valClass="text-amber-300" icon="Percent" sign="− " info={t.info.interest} />
                <FinBar label={t.lifestyleSpending} value={s.lifestyleSpend} max={guvMax} barClass="bg-fuchsia-500" valClass="text-fuchsia-300" icon="Sparkles" sign="− " info={t.info.lifestyle} />
              </div>
            );
          })()}
          <NetCashflowRow label={t.netCashflow} value={d.netCashflow} info={t.info.netCashflow} />

          <h2 className="mb-2 mt-5 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-slate-400">
            <Icon name="Scale" size={16} /> {t.balance}
          </h2>
          {/* T-Konto: Aktiva links, Passiva rechts */}
          <div className="rounded-xl border border-slate-700 overflow-hidden text-xs">
            {/* Kopfzeile */}
            <div className="grid grid-cols-2 divide-x divide-slate-700 bg-slate-800">
              <div className="px-3 py-1.5 font-bold uppercase tracking-wide text-slate-400">{t.aktivaTitle}</div>
              <div className="px-3 py-1.5 font-bold uppercase tracking-wide text-slate-400">{t.passivaTitle}</div>
            </div>
            {/* Inhalt */}
            <div className="grid grid-cols-2 divide-x divide-slate-700">
              {/* Aktiva */}
              <div className="divide-y divide-slate-800/80">
                <TRow label={t.cash} value={s.cash}
                  colorClass={s.cash < 0 ? 'text-rose-300' : 'text-emerald-400'}
                  sign={s.cash < 0 ? '− ' : ''}
                  info={t.info.cash} />
                <TRow label={`${t.stocks} (${s.stockUnits}×)`} value={d.stocksVal}
                  colorClass="text-teal-300" info={t.info.stocks} />
                <TRow label={`${t.realEstate} (${s.realEstateUnits}×)`} value={d.reVal}
                  colorClass="text-violet-300" info={t.info.realEstate} />
              </div>
              {/* Passiva */}
              <div className="divide-y divide-slate-800/80">
                <TRow label={t.debt} value={s.loans}
                  colorClass="text-rose-300" sign="− "
                  info={t.info.loans} />
                <TRow label={t.equity} value={d.netWorth}
                  colorClass={d.netWorth >= 0 ? 'text-emerald-400' : 'text-rose-400'}
                  sign={d.netWorth < 0 ? '− ' : ''}
                  info={t.info.equity} />
                <div className="px-3 py-2 opacity-0 select-none"><span className="text-xs">—</span></div>
              </div>
            </div>
            {/* Summenzeile */}
            <div className="grid grid-cols-2 divide-x divide-slate-600 border-t border-slate-600 bg-slate-800/60">
              <div className="px-3 py-2">
                <div className="text-[10px] uppercase tracking-wide text-slate-500">Σ {t.aktivaTitle}</div>
                <div className="tabular-nums font-bold text-slate-200">{fmt(s.cash + d.stocksVal + d.reVal)}</div>
              </div>
              <div className="px-3 py-2">
                <div className="text-[10px] uppercase tracking-wide text-slate-500">Σ {t.passivaTitle}</div>
                <div className="tabular-nums font-bold text-slate-200">{fmt(s.loans + d.netWorth)}</div>
              </div>
            </div>
          </div>
        </section>

        {/* Spalte Mitte – Aktionen */}
        <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
          <h2 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-slate-400">
            <Icon name="Briefcase" size={16} /> {t.actions}
          </h2>
          <div className="space-y-2.5">
            <ActionButton onClick={changeJob} disabled={busy || s.lastJobChangeAge === s.age} icon="Briefcase" accent="sky"
              title={t.changeJob} subtitle={s.lastJobChangeAge === s.age ? t.jobChangedThisYear : t.changeJobSub} />
            <ActionButton onClick={goSelfEmployed} disabled={busy || s.selfEmployed || s.lastJobChangeAge === s.age} icon="Sparkles" accent="amber"
              title={t.selfEmployed} subtitle={s.selfEmployed ? t.selfEmployedOn : t.selfEmployedSub} />
            <TradeCard icon="TrendingUp" accent="emerald" title={t.buyStocks}
              priceLabel={t.priceLabel} price={s.stockPrice} owned={s.stockUnits} ownedLabel={t.owned}
              qty={s.stockQty} setQty={setStockQty} qtyLabel={t.quantity}
              onBuy={buyStocks} onSell={sellStocks}
              buyTotal={s.stockQty * s.stockPrice} sellTotal={Math.min(s.stockQty, s.stockUnits) * s.stockPrice}
              canBuy={!busy && s.cash >= s.stockQty * s.stockPrice} canSell={!busy && s.stockUnits > 0}
              busy={busy} buyLabel={t.buy} sellLabel={t.sell} />
            <TradeCard icon="Building2" accent="violet" title={t.buyApartments}
              priceLabel={t.priceLabel} price={s.realEstatePrice}
              buyPrice={s.realEstatePrice * RE_BUY_FACTOR}
              owned={s.realEstateUnits} ownedLabel={t.owned}
              qty={s.realEstateQty} setQty={setRealEstateQty} qtyLabel={t.quantity}
              onBuy={buyRealEstate} onSell={sellRealEstate}
              buyTotal={s.realEstateQty * s.realEstatePrice * RE_BUY_FACTOR * 0.1}
              sellTotal={Math.min(s.realEstateQty, s.realEstateUnits) * s.realEstatePrice - (s.realEstateUnits > 0 ? (s.loans / s.realEstateUnits) * Math.min(s.realEstateQty, s.realEstateUnits) : 0)}
              canBuy={!busy && s.cash >= s.realEstateQty * s.realEstatePrice * RE_BUY_FACTOR * 0.1}
              canSell={!busy && s.realEstateUnits > 0}
              busy={busy} buyLabel={t.buy} sellLabel={t.sell}
              reBuyInfo={t.info.reBuyFee} />
          </div>

          <div className="mt-5 rounded-xl border border-slate-700 bg-slate-800/40 p-4">
            <div className="mb-1 flex items-center justify-between">
              <span className="flex items-center gap-2 text-sm font-semibold text-slate-200"><Icon name="Sparkles" size={15} className="text-fuchsia-400" /> {t.lifestyleTitle}</span>
              <span className="tabular-nums font-bold text-fuchsia-400">{fmt(s.lifestyleSpend)}</span>
            </div>
            <input type="range" min="0" max="40000" step="1000" value={s.lifestyleSpend}
              onChange={(e) => setLifestyle(Number(e.target.value))} disabled={busy}
              className="w-full" />
            <div className="mt-1 flex justify-between text-[10px] text-slate-500"><span>{fmt(0)}</span><span>{fmt(40000)}</span></div>
            <p className="mt-2 text-xs leading-relaxed text-slate-400">
              {t.lifestyleA}<span className="text-rose-400">{fmt(0)}</span>{t.lifestyleB}<span className="text-emerald-400">{fmt(15000)}</span>{t.lifestyleC}
            </p>
          </div>
        </section>

        {/* Spalte Rechts – Event-Log */}
        <section className="flex flex-col rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
          <h2 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-slate-400">
            <Icon name="ScrollText" size={16} /> {t.eventLog}
          </h2>
          <div className="flex-1 space-y-1.5 overflow-y-auto pr-1" style={{ maxHeight: '70vh' }}>
            {s.log.map((e, i) => (
              <div key={i} className="flex gap-2 rounded-lg bg-slate-800/40 px-2.5 py-1.5 text-xs">
                <span className="shrink-0 font-mono font-semibold text-slate-500">{e.age}</span>
                <span className={e.kind === 'good' ? 'text-emerald-300' : e.kind === 'bad' ? 'text-rose-300' : 'text-slate-300'}>{e.text}</span>
              </div>
            ))}
          </div>
        </section>
      </div>

      {/* Verlaufs-Charts: Vermögen & Kurs-Index */}
      <div className="mt-4 grid gap-4 lg:grid-cols-2">
        <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
          <h2 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-slate-400">
            <Icon name="Scale" size={16} /> {t.chartTitle}
          </h2>
          <LineChart data={s.history} emptyText={t.chartNoData} fmtVal={fmt} baseline={0}
            series={[
              { key: 'assets', color: '#10b981', label: t.legendAssets },
              { key: 'liabilities', color: '#f43f5e', label: t.legendLiabilities },
              { key: 'equity', color: '#38bdf8', label: t.legendEquity },
            ]} />
        </section>
        <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
          <h2 className="mb-3 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-slate-400">
            <Icon name="TrendingUp" size={16} /> {t.priceChartTitle}
          </h2>
          <LineChart data={priceData} emptyText={t.chartNoData} fmtVal={(v) => Math.round(v)} baseline={100}
            series={[
              { key: 'stockIdx', color: '#2dd4bf', label: t.stocks },
              { key: 'reIdx', color: '#a78bfa', label: t.realEstate },
            ]} />
        </section>
      </div>

      {/* ---------- Overlays ---------- */}
      {s.gameState === 'modal' && s.event === 'start' && (
        <Modal>
          <div className="mb-4 flex items-center gap-3">
            <span className="grid place-items-center w-11 h-11 rounded-xl bg-sky-500/15 text-sky-400"><Icon name="GraduationCap" size={24} /></span>
            <div><h3 className="text-lg font-bold text-slate-100">{t.startTitle}</h3>
            <p className="text-xs text-slate-400">{t.startDesc}</p></div>
          </div>
          <div className="flex gap-3">
            <button onClick={() => chooseStart('ausbildung')} className="flex-1 rounded-xl border border-emerald-500/40 bg-emerald-500/10 p-4 text-left hover:bg-emerald-500/20 transition">
              <div className="font-bold text-emerald-300">{t.apprentice}</div>
              <div className="mt-1 text-xs text-slate-400">{t.apprenticeDesc}</div>
            </button>
            <button onClick={() => chooseStart('studium')} className="flex-1 rounded-xl border border-sky-500/40 bg-sky-500/10 p-4 text-left hover:bg-sky-500/20 transition">
              <div className="font-bold text-sky-300">{t.university}</div>
              <div className="mt-1 text-xs text-slate-400">{t.universityDesc}</div>
            </button>
          </div>
        </Modal>
      )}

      {s.gameState === 'modal' && s.event === 'wedding' && (
        <Modal>
          <div className="mb-4 flex items-center gap-3">
            <span className="grid place-items-center w-11 h-11 rounded-xl bg-rose-500/15 text-rose-400"><Icon name="Heart" size={24} /></span>
            <div><h3 className="text-lg font-bold text-slate-100">{t.weddingTitle}</h3>
            <p className="text-xs text-slate-400">{t.weddingDesc}</p></div>
          </div>
          <p className="mb-4 text-sm text-slate-300">{t.weddingBody}</p>
          <div className="flex gap-3">
            <ChoiceBtn onClick={() => chooseWedding(true)} accent="rose">{t.weddingYes}</ChoiceBtn>
            <ChoiceBtn onClick={() => chooseWedding(false)} accent="slate">{t.no}</ChoiceBtn>
          </div>
        </Modal>
      )}

      {s.gameState === 'modal' && s.event === 'kids' && (
        <Modal>
          <div className="mb-4 flex items-center gap-3">
            <span className="grid place-items-center w-11 h-11 rounded-xl bg-amber-500/15 text-amber-400"><Icon name="Baby" size={24} /></span>
            <div><h3 className="text-lg font-bold text-slate-100">{t.kidsTitle}</h3>
            <p className="text-xs text-slate-400">{t.kidsDesc}</p></div>
          </div>
          <p className="mb-3 text-sm text-slate-300">{t.kidsPerChild}</p>
          <div className="mb-4 rounded-xl border border-slate-700 bg-slate-800/40 p-3">
            <div className="mb-2 flex items-center gap-2">
              <span className="w-20 text-[10px] uppercase tracking-wide text-slate-500">{t.numChildren}</span>
              <input type="range" min="1" max="10" step="1" value={s.kidsQty}
                onChange={(e) => setKidsQty(Number(e.target.value))} className="flex-1" />
              <span className="w-6 text-center tabular-nums font-bold text-amber-400">{s.kidsQty}</span>
            </div>
            <div className="grid grid-cols-3 gap-2 text-center text-xs">
              <div className="rounded-lg bg-slate-900/60 p-2"><div className="text-slate-500">{t.costLbl}</div><div className="font-semibold text-rose-300">− {fmt(5000 * s.kidsQty)}</div></div>
              <div className="rounded-lg bg-slate-900/60 p-2"><div className="text-slate-500">{t.fixedLbl}</div><div className="font-semibold text-amber-300">+ {fmt(6000 * s.kidsQty)}</div></div>
              <div className="rounded-lg bg-slate-900/60 p-2"><div className="text-slate-500">{t.joyLbl}</div><div className="font-semibold text-emerald-300">+ {Math.min(15 * s.kidsQty, 100)}</div></div>
            </div>
          </div>
          <div className="flex gap-3">
            <ChoiceBtn onClick={() => chooseKids(true)} accent="amber">{t.kidsYes(s.kidsQty)}</ChoiceBtn>
            <ChoiceBtn onClick={() => chooseKids(false)} accent="slate">{t.no}</ChoiceBtn>
          </div>
        </Modal>
      )}

      {s.gameState === 'gameover' && !s.endHidden && (
        <Modal>
          <div className="text-center">
            <span className="mx-auto mb-3 grid place-items-center w-16 h-16 rounded-2xl bg-rose-500/15 text-rose-400"><Icon name="AlertTriangle" size={34} /></span>
            <h3 className="text-2xl font-bold text-rose-400">{t.bankruptTitle}</h3>
            <p className="mt-2 text-sm text-slate-400">{t.bankruptDesc(s.age)}</p>
            <div className="mt-4 rounded-xl bg-slate-800/60 p-3 text-sm">
              <div className="flex justify-between"><span className="text-slate-400">{t.equity}</span><span className="font-bold text-rose-400">{fmt(d.netWorth)}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">{t.joyTop}</span><span className="font-bold text-slate-200">{Math.round(s.joy)} / 100</span></div>
            </div>
            <div className="mt-5 flex gap-3">
              <button onClick={hideEnd} className="flex-1 rounded-xl border border-slate-600 bg-slate-800 px-4 py-3 font-semibold text-slate-200 hover:bg-slate-700 transition">{t.viewHistory}</button>
              <button onClick={restart} className="flex-1 rounded-xl bg-emerald-500 px-4 py-3 font-semibold text-slate-900 hover:bg-emerald-400 transition">{t.newGame}</button>
            </div>
          </div>
        </Modal>
      )}

      {s.gameState === 'won' && !s.endHidden && (
        <Modal>
          <div className="text-center">
            <span className="mx-auto mb-3 grid place-items-center w-16 h-16 rounded-2xl bg-amber-500/15 text-amber-400"><Icon name="Trophy" size={34} /></span>
            <h3 className="text-2xl font-bold text-amber-400">{t.wonTitle}</h3>
            <p className="mt-2 text-sm text-slate-400">{t.wonDesc(END_AGE)}</p>
            <div className="mt-4 rounded-xl bg-slate-800/60 p-3 text-sm space-y-1">
              <div className="flex justify-between"><span className="text-slate-400">{t.equity}</span><span className="font-bold text-emerald-400">{fmt(d.netWorth)}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">{t.cashLbl}</span><span className="font-bold text-slate-200">{fmt(s.cash)}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">{t.joyTop}</span><span className="font-bold text-slate-200">{Math.round(s.joy)} / 100</span></div>
            </div>
            <div className="mt-5 flex gap-3">
              <button onClick={hideEnd} className="flex-1 rounded-xl border border-slate-600 bg-slate-800 px-4 py-3 font-semibold text-slate-200 hover:bg-slate-700 transition">{t.viewHistory}</button>
              <button onClick={restart} className="flex-1 rounded-xl bg-emerald-500 px-4 py-3 font-semibold text-slate-900 hover:bg-emerald-400 transition">{t.playAgain}</button>
            </div>
          </div>
        </Modal>
      )}

      {(s.gameState === 'won' || s.gameState === 'gameover') && s.endHidden && (
        <div className="fixed bottom-4 left-1/2 z-40 flex -translate-x-1/2 items-center gap-3 rounded-xl border border-slate-700 bg-slate-900/95 px-4 py-2 shadow-xl">
          <span className="text-sm font-semibold text-slate-300">{t.finished}</span>
          <button onClick={showEnd} className="rounded-lg border border-slate-600 bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">{t.showResult}</button>
          <button onClick={restart} className="rounded-lg bg-emerald-500 px-3 py-1.5 text-xs font-semibold text-slate-900 hover:bg-emerald-400 transition">{t.newGame}</button>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){ if (window.console) console.error('App-Fehler:', error, info); }
  render(){
    if (this.state.error) {
      return (
        <div className="m-8 rounded-xl border border-rose-500/40 bg-slate-900 p-6 font-mono text-sm text-rose-300">
          <b>Fehler in der App:</b> {String(this.state.error.message || this.state.error)}
          <pre className="mt-3 whitespace-pre-wrap text-xs text-slate-400">{this.state.error.stack}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
