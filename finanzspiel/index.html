<script>
  window.onerror = function(msg, src, line, col, err){
    // Opake Cross-Origin-Fehler (z. B. aus CDN-Skripten) liefern keine Details
    // (msg "Script error.", line 0) und duerfen eine bereits laufende App NICHT ersetzen.
    var opaque = !err && (line === 0 || !src);
    var d = document.getElementById('root');
    if (opaque || (d && d.childElementCount > 0)) {
      if (window.console) console.warn('Script-Fehler ignoriert (App laeuft weiter):', msg);
      return;
    }
    if (d) d.innerHTML = '<div style="color:#f87171;padding:2rem;font-family:monospace;background:#1e293b;margin:2rem;border-radius:8px">'+
      '<b>JS-Fehler Zeile '+line+':</b> '+msg+
      (err && err.stack ? '<pre style="margin-top:1rem;font-size:.75rem;white-space:pre-wrap">'+err.stack+'</pre>' : '')+'</div>';
  };
</script>

/* ---------- Helpers ---------- */
const TICK_MS = 4000;
const END_AGE = 67;
const rand = (min, max) => Math.random() * (max - min) + min;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let CUR_LANG = 'de';
const fmt = (n) => CUR_LANG === 'en'
  ? '€' + Math.round(n).toLocaleString('en-US')
  : Math.round(n).toLocaleString('de-DE') + ' €';
const pct = (n) => n.toLocaleString(CUR_LANG === 'en' ? 'en-US' : 'de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';

/* Abgeleitete Finanzkennzahlen (rein, ohne Seiteneffekt) */
function derive(s){
  const interestExpenses = s.loans * (s.interestRate / 100);
  const totalExpenses = s.basisExpenses + s.lifestyleSpend + interestExpenses;
  const netCashflow = s.salary - totalExpenses;
  const netWorth = (s.cash + s.stocks + s.realEstate) - s.loans;
  return { interestExpenses, totalExpenses, netCashflow, netWorth };
}

/* ---------- Initialer State ---------- */
function initialState(){
  return {
    gameState: 'modal',      // running | modal | gameover | won
    event: 'start',          // start | wedding | kids | null
    age: 16,
    cash: 0, stocks: 0, realEstate: 0,
    loans: 0,
    salary: 0,
    basisExpenses: 15000,
    inflation: 2, interestRate: 3,
    joy: 50,
    lifestyleSpend: 0,
    stockQty: 1, realEstateQty: 1, kidsQty: 1,
    lang: 'de',
    history: [],
    flags: { wedding: false, kids: false },
    log: [{ age: 16, text: T.de.L.start(), kind: 'info' }],
  };
}

function addLog(log, age, text, kind = 'info'){
  return [{ age, text, kind }, ...log].slice(0, 80);
}

/* ---------- Tick: ein Lebensjahr ---------- */
function advanceYear(prev){
  const d = derive(prev);
  const L = T[prev.lang].L;
  let log = prev.log;

  // Makro-Updates
  const newInflation = rand(1, 6);
  const newInterest = newInflation + rand(0, 3);
  const newBasis = prev.basisExpenses * (1 + newInflation / 100);
  const newSalary = prev.salary * 1.02;
  const newCash = prev.cash + d.netCashflow;

  // Aktien schwanken (nur wenn vorhanden)
  let newStocks = prev.stocks;
  let stockChange = 0;
  if (prev.stocks > 0) {
    stockChange = rand(-15, 20);
    newStocks = prev.stocks * (1 + stockChange / 100);
  }

  // Joy
  let joyDelta;
  if (prev.lifestyleSpend === 0) joyDelta = -5;
  else if (prev.lifestyleSpend > 15000) joyDelta = 5;
  else joyDelta = 1;
  const newJoy = clamp(prev.joy + joyDelta, 0, 100);

  const newAge = prev.age + 1;

  // Logs für das Jahr
  log = addLog(log, newAge, L.year(newInflation, newInterest, d.netCashflow), d.netCashflow >= 0 ? 'good' : 'bad');
  if (prev.stocks > 0) {
    log = addLog(log, newAge, L.stockMove(stockChange, newStocks), stockChange >= 0 ? 'good' : 'bad');
  }

  let next = {
    ...prev,
    age: newAge,
    inflation: newInflation,
    interestRate: newInterest,
    basisExpenses: newBasis,
    salary: newSalary,
    cash: newCash,
    stocks: newStocks,
    joy: newJoy,
    log,
  };

  // Game-Over-Prüfung (mit aktualisierten Werten) + Verlaufspunkt
  const nd = derive(next);
  next.history = [...prev.history, { age: newAge, assets: next.cash + next.stocks + next.realEstate, liabilities: next.loans, equity: nd.netWorth }];
  if (nd.netWorth < 0 || (next.cash < 0 && nd.netCashflow < 0)) {
    next.gameState = 'gameover';
    next.event = null;
    next.log = addLog(next.log, newAge, L.bankrupt(), 'bad');
    return next;
  }

  // Gewonnen
  if (newAge >= END_AGE) {
    next.gameState = 'won';
    next.event = null;
    next.log = addLog(next.log, newAge, L.retired(nd.netWorth), 'good');
    return next;
  }

  // Lebensereignisse → Spiel pausieren
  if (newAge >= 28 && !next.flags.wedding) {
    next.gameState = 'modal';
    next.event = 'wedding';
  } else if (newAge >= 32 && !next.flags.kids) {
    next.gameState = 'modal';
    next.event = 'kids';
  }

  return next;
}

/* ---------- UI-Bausteine ---------- */
function ActionButton({ onClick, disabled, icon, title, subtitle, accent }){
  return (
    <button onClick={onClick} disabled={disabled}
      className={`w-full text-left rounded-xl border p-3 transition group
        ${disabled ? 'opacity-40 cursor-not-allowed border-slate-800 bg-slate-900'
        : `border-slate-700 bg-slate-800/60 hover:border-${accent}-500 hover:bg-slate-800`}`}>
      <div className="flex items-center gap-3">
        <span className={`grid place-items-center w-9 h-9 rounded-lg bg-${accent}-500/15 text-${accent}-400 shrink-0`}>
          <Icon name={icon} size={18} />
        </span>
        <div className="min-w-0">
          <div className="text-sm font-semibold text-slate-100">{title}</div>
          <div className="text-xs text-slate-400 leading-tight">{subtitle}</div>
        </div>
      </div>
    </button>
  );
}

function Bar({ value, max = 100 }){
  const w = clamp((value / max) * 100, 0, 100);
  const color = w > 60 ? 'bg-emerald-500' : w > 30 ? 'bg-amber-500' : 'bg-rose-500';
  return (
    <div className="h-2 w-full rounded-full bg-slate-700 overflow-hidden">
      <div className={`h-full ${color} transition-all`} style={{ width: w + '%' }} />
    </div>
  );
}

/* Grafischer Balken für GuV / Bilanz */
function FinBar({ label, value, max, barClass, valClass = 'text-slate-200', icon, sign = '' }){
  const w = max > 0 ? clamp((Math.abs(value) / max) * 100, 0, 100) : 0;
  return (
    <div className="mb-2.5">
      <div className="mb-1 flex items-center justify-between text-xs">
        <span className="flex items-center gap-1.5 text-slate-400">
          {icon && <Icon name={icon} size={13} className="text-slate-500" />}{label}
        </span>
        <span className={`tabular-nums font-semibold ${valClass}`}>{sign}{fmt(Math.abs(value))}</span>
      </div>
      <div className="h-2.5 w-full overflow-hidden rounded-full bg-slate-800">
        <div className={`h-full ${barClass} transition-all duration-500`} style={{ width: w + '%' }} />
      </div>
    </div>
  );
}

/* Kauf-Karte mit Mengen-Regler (1–10) */
function BuyCard({ icon, accent, title, unitLabel, unitCost, qty, setQty, onBuy, busy, cash, hint, qtyLabel }){
  const total = unitCost * qty;
  const afford = cash >= total;
  const lock = busy || !afford;
  return (
    <div className="rounded-xl border border-slate-700 bg-slate-800/40 p-3">
      <div className="mb-2 flex items-center gap-3">
        <span className={`grid place-items-center w-9 h-9 rounded-lg bg-${accent}-500/15 text-${accent}-400 shrink-0`}><Icon name={icon} size={18} /></span>
        <div className="min-w-0">
          <div className="text-sm font-semibold text-slate-100">{title}</div>
          <div className="text-xs text-slate-400 leading-tight">{hint}</div>
        </div>
      </div>
      <div className="mb-2 flex items-center gap-2">
        <span className="w-12 text-[10px] uppercase tracking-wide text-slate-500">{qtyLabel}</span>
        <input type="range" min="1" max="10" step="1" value={qty} disabled={busy}
          onChange={(e) => setQty(Number(e.target.value))} className="flex-1" />
        <span className={`w-6 text-center tabular-nums font-bold text-${accent}-400`}>{qty}</span>
      </div>
      <button onClick={() => onBuy(qty)} disabled={lock}
        className={`w-full rounded-lg px-3 py-2 text-sm font-semibold transition ${lock ? 'cursor-not-allowed bg-slate-800 text-slate-600' : `bg-${accent}-500/15 text-${accent}-300 hover:bg-${accent}-500/25`}`}>
        {qty} × {unitLabel} · {fmt(total)}
      </button>
    </div>
  );
}

/* ---------- Zeitverlauf-Chart (Assets / Liabilities / Equity) ---------- */
function TimeChart({ data, t }){
  if (!data || data.length < 2) {
    return <div className="grid h-44 place-items-center text-sm text-slate-500">{t.chartNoData}</div>;
  }
  const W = 760, H = 220, padL = 56, padR = 12, padT = 14, padB = 26;
  const minAge = data[0].age, maxAge = data[data.length - 1].age;
  const vals = [];
  data.forEach(p => vals.push(p.assets, p.liabilities, p.equity));
  let maxV = Math.max(...vals, 0);
  let minV = Math.min(...vals, 0);
  if (maxV === minV) maxV = minV + 1;
  const x = (a) => padL + (maxAge === minAge ? 0 : (a - minAge) / (maxAge - minAge)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - minV) / (maxV - minV)) * (H - padT - padB);
  const path = (key) => data.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(p.age).toFixed(1)} ${y(p[key]).toFixed(1)}`).join(' ');
  const series = [
    { key: 'assets', color: '#10b981', label: t.legendAssets },
    { key: 'liabilities', color: '#f43f5e', label: t.legendLiabilities },
    { key: 'equity', color: '#38bdf8', label: t.legendEquity },
  ];
  const zeroY = y(0);
  const last = data[data.length - 1];
  return (
    <div>
      <div className="mb-2 flex flex-wrap gap-4">
        {series.map(se => (
          <span key={se.key} className="flex items-center gap-1.5 text-xs text-slate-400">
            <span className="inline-block h-2.5 w-3 rounded-sm" style={{ background: se.color }} />
            {se.label} <span className="tabular-nums font-semibold text-slate-200">{fmt(last[se.key])}</span>
          </span>
        ))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }} preserveAspectRatio="xMidYMid meet">
        <line x1={padL} y1={padT} x2={padL} y2={H - padB} stroke="#334155" strokeWidth="1" />
        <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke="#334155" strokeWidth="1" />
        {minV < 0 && maxV > 0 && (
          <line x1={padL} y1={zeroY} x2={W - padR} y2={zeroY} stroke="#475569" strokeWidth="1" strokeDasharray="4 4" />
        )}
        <text x={padL - 6} y={y(maxV) + 4} textAnchor="end" fill="#64748b" fontSize="11">{fmt(maxV)}</text>
        <text x={padL - 6} y={y(minV) + 4} textAnchor="end" fill="#64748b" fontSize="11">{fmt(minV)}</text>
        <text x={padL} y={H - 8} textAnchor="start" fill="#64748b" fontSize="11">{minAge}</text>
        <text x={W - padR} y={H - 8} textAnchor="end" fill="#64748b" fontSize="11">{maxAge}</text>
        {series.map(se => (
          <path key={se.key} d={path(se.key)} fill="none" stroke={se.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        ))}
      </svg>
    </div>
  );
}

/* ---------- Modals ---------- */
function Modal({ children }){
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
      <div className="pop w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-900 p-7 shadow-2xl">

}

function ChoiceBtn({ onClick, accent, children }){

    <button onClick={onClick}
      className={`flex-1 rounded-xl border border-${accent}-500/40 bg-${accent}-500/10 px-4 py-3
        text-${accent}-300 font-semibold hover:bg-${accent}-500/20 transition`}>
      {children}
    </button>
  );
}

/* ---------- Haupt-App ---------- */
function App(){
  const [s, setS] = useState(initialState);
  const stateRef = useRef(s);
  stateRef.current = s;

  // Game Loop – pausiert automatisch, wenn nicht "running"
  useEffect(() => {
    if (s.gameState !== 'running') return;
    const id = setInterval(() => setS(prev => advanceYear(prev)), TICK_MS);
    return () => clearInterval(id);
  }, [s.gameState]);

  CUR_LANG = s.lang;
  const t = T[s.lang];
  const d = derive(s);
  const busy = s.gameState !== 'running';

  const seedHistory = (st) => {
    const nd = derive(st);
    return [{ age: st.age, assets: st.cash + st.stocks + st.realEstate, liabilities: st.loans, equity: nd.netWorth }];
  };

  const toggleLang = (lng) => setS(p => ({ ...p, lang: lng }));

  /* --- Permanente Aktionen --- */
  const changeJob = () => setS(p => {
    if (p.gameState !== 'running') return p;
    const L = T[p.lang].L;
    if (Math.random() < 0.15) {
      const salary = 20000;
      return { ...p, salary, log: addLog(p.log, p.age, L.jobFail(salary), 'bad') };
    }
    const salary = p.salary * 1.25;
    return { ...p, salary, log: addLog(p.log, p.age, L.jobOk(salary), 'good') };
  });

  const buyStocks = (n) => setS(p => {
    if (p.gameState !== 'running') return p;
    const L = T[p.lang].L;
    const cost = 5000 * n;
    if (p.cash < cost) return { ...p, log: addLog(p.log, p.age, L.stocksReject(cost), 'bad') };
    return { ...p, cash: p.cash - cost, stocks: p.stocks + cost, log: addLog(p.log, p.age, L.stocksBuy(n, cost), 'good') };
  });

  const buyRealEstate = (n) => setS(p => {
    if (p.gameState !== 'running') return p;
    const L = T[p.lang].L;
    const need = 25000 * n;
    if (p.cash < need) return { ...p, log: addLog(p.log, p.age, L.reReject(need), 'bad') };
    return {
      ...p,
      cash: p.cash - need,
      realEstate: p.realEstate + 250000 * n,
      loans: p.loans + 225000 * n,
      salary: p.salary + 15000 * n,
      log: addLog(p.log, p.age, L.reBuy(n, 250000 * n, 225000 * n, 15000 * n), 'good'),
    };
  });

  const setLifestyle = (v) => setS(p => ({ ...p, lifestyleSpend: v }));
  const setStockQty = (v) => setS(p => ({ ...p, stockQty: v }));
  const setRealEstateQty = (v) => setS(p => ({ ...p, realEstateQty: v }));
  const setKidsQty = (v) => setS(p => ({ ...p, kidsQty: v }));

  /* --- Event-Entscheidungen --- */
  const chooseStart = (path) => setS(p => {
    const L = T[p.lang].L;
    const base = path === 'ausbildung'
      ? { ...p, gameState: 'running', event: null, age: 19, cash: 5000, salary: 24000, loans: 0, log: addLog(p.log, 19, L.apprenticeDone(), 'good') }
      : { ...p, gameState: 'running', event: null, age: 23, cash: 0, salary: 45000, loans: 10000, log: addLog(p.log, 23, L.universityDone(), 'good') };
    base.history = seedHistory(base);
    return base;
  });

  const chooseWedding = (yes) => setS(p => {
    const L = T[p.lang].L;
    const flags = { ...p.flags, wedding: true };
    if (!yes) return { ...p, gameState: 'running', event: null, flags, log: addLog(p.log, p.age, L.single(), 'info') };
    return { ...p, gameState: 'running', event: null, flags,
      cash: p.cash - 10000, basisExpenses: p.basisExpenses * 1.15, joy: clamp(p.joy + 20, 0, 100),
      log: addLog(p.log, p.age, L.married(), 'good') };
  });

  const chooseKids = (yes) => setS(p => {
    const L = T[p.lang].L;
    const flags = { ...p.flags, kids: true };
    if (!yes) return { ...p, gameState: 'running', event: null, flags, log: addLog(p.log, p.age, L.noKids(), 'info') };
    const n = p.kidsQty;
    return { ...p, gameState: 'running', event: null, flags,
      cash: p.cash - 5000 * n, basisExpenses: p.basisExpenses + 6000 * n, joy: clamp(p.joy + 15 * n, 0, 100),
      log: addLog(p.log, p.age, L.kids(n, 5000 * n, 6000 * n, Math.min(15 * n, 100)), 'good') };
  });

  const restart = () => setS(p => ({ ...initialState(), lang: p.lang, log: [{ age: 16, text: T[p.lang].L.start(), kind: 'info' }] }));

  /* ---------- Render ---------- */
  return (

            <span className="grid place-items-center w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-400">
              <Icon name="Coins" size={22} />
            </span>
            <div>
              <h1 className="text-lg font-bold text-slate-100 leading-tight">Cashflow Life</h1>
              <p className="text-xs text-slate-500">{t.subtitle}</p>
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-5">
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wide text-slate-500">{t.age}</div>
              <div className="text-xl font-bold text-slate-100 tabular-nums">{s.age} <span className="text-sm text-slate-500">/ {END_AGE}</span></div>
            </div>
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wide text-slate-500 flex items-center gap-1 justify-center"><Icon name="TrendingUp" size={12} />{t.inflation}</div>
              <div className="text-xl font-bold text-amber-400 tabular-nums">{pct(s.inflation)}</div>
            </div>
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wide text-slate-500 flex items-center gap-1 justify-center"><Icon name="Landmark" size={12} />{t.interest}</div>
              <div className="text-xl font-bold text-sky-400 tabular-nums">{pct(s.interestRate)}</div>
            </div>
            <div className="min-w-[150px]">
              <div className="text-[10px] uppercase tracking-wide text-slate-500 flex items-center gap-1 mb-1"><Icon name="Smile" size={12} />{t.joyTop} {Math.round(s.joy)}</div>
              <Bar value={s.joy} />
            </div>
            <div className="flex overflow-hidden rounded-lg border border-slate-700">
              {['de', 'en'].map(lng => (
                <button key={lng} onClick={() => toggleLang(lng)}
                  className={`px-2.5 py-1 text-xs font-bold uppercase transition ${s.lang === lng ? 'bg-emerald-500 text-slate-900' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}>
                  {lng}
                </button>
              ))}
            </div>
          </div>
        </div>
      </header>

      <div className="grid gap-4 lg:grid-cols-3">
        {/* Spalte Links – Financial Statement */}
        <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
          <h2 className="mb-2 flex items-center gap-2 text-sm font-bold uppercase tracking-wide text-slate-400">
            <Icon name="ScrollText" size={16} /> {t.guv}
          </h2>
          {(() => {
            const guvMax = Math.max(s.salary, d.totalExpenses, 1);
            return (
              <div>
                <FinBar label={t.income} value={s.salary} max={guvMax} barClass="bg-emerald-500" valClass="text-emerald-400" icon="Banknote" sign="+ " />
                <FinBar label={t.fixedCosts} value={s.basisExpenses} max={guvMax} barClass="bg-rose-500" valClass="text-rose-300" icon="ShoppingBag" sign="− " />
                <FinBar label={t.interestExp} value={d.interestExpenses} max={guvMax} barClass="bg-amber-500" valClass="text-amber-300" icon="Percent" sign="− " />
                <FinBar label={t.lifestyleSpending} value={s.lifestyleSpend} max={guvMax} barClass="bg-fuchsia-500" valClass="text-fuchsia-300" icon="Sparkles" sign="− " />
              </div>

          <div className="mt-2 flex items-center justify-between rounded-lg bg-slate-800/60 px-3 py-2">

        <Modal>
          <div className="text-center">
            <span className="mx-auto mb-3 grid place-items-center w-16 h-16 rounded-2xl bg-rose-500/15 text-rose-400"><Icon name="AlertTriangle" size={34} /></span>
            <h3 className="text-2xl font-bold text-rose-400">{t.bankruptTitle}</h3>
            <p className="mt-2 text-sm text-slate-400">{t.bankruptDesc(s.age)}</p>
            <div className="mt-4 rounded-xl bg-slate-800/60 p-3 text-sm">
              <div className="flex justify-between"><span className="text-slate-400">{t.equity}</span><span className="font-bold text-rose-400">{fmt(d.netWorth)}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">{t.joyTop}</span><span className="font-bold text-slate-200">{Math.round(s.joy)} / 100</span></div>
            </div>
            <button onClick={restart} className="mt-5 w-full rounded-xl bg-emerald-500 px-4 py-3 font-semibold text-slate-900 hover:bg-emerald-400 transition">{t.newGame}</button>
          </div>
        </Modal>
      )}

      {s.gameState === 'won' && (
        <Modal>
          <div className="text-center">
            <span className="mx-auto mb-3 grid place-items-center w-16 h-16 rounded-2xl bg-amber-500/15 text-amber-400"><Icon name="Trophy" size={34} /></span>
            <h3 className="text-2xl font-bold text-amber-400">{t.wonTitle}</h3>
            <p className="mt-2 text-sm text-slate-400">{t.wonDesc(END_AGE)}</p>
            <div className="mt-4 rounded-xl bg-slate-800/60 p-3 text-sm space-y-1">
              <div className="flex justify-between"><span className="text-slate-400">{t.equity}</span><span className="font-bold text-emerald-400">{fmt(d.netWorth)}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">{t.cashLbl}</span><span className="font-bold text-slate-200">{fmt(s.cash)}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">{t.joyTop}</span><span className="font-bold text-slate-200">{Math.round(s.joy)} / 100</span></div>
            </div>
            <button onClick={restart} className="mt-5 w-full rounded-xl bg-emerald-500 px-4 py-3 font-semibold text-slate-900 hover:bg-emerald-400 transition">{t.playAgain}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){ if (window.console) console.error('App-Fehler:', error, info); }
  render(){
    if (this.state.error) {
      return (
        <div className="m-8 rounded-xl border border-rose-500/40 bg-slate-900 p-6 font-mono text-sm text-rose-300">
          <b>Fehler in der App:</b> {String(this.state.error.message || this.state.error)}
          <pre className="mt-3 whitespace-pre-wrap text-xs text-slate-400">{this.state.error.stack}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
